<script>
(function(){
  var cfg = window.FIREBASE_CONFIG;
  if(!cfg || !cfg.apiKey || String(cfg.apiKey).indexOf("貼上") === 0 || !window.firebase) return;
  try{ firebase.initializeApp(cfg); }catch(e){ return; }
  var auth = firebase.auth(), fs = firebase.firestore();
  // Some phone browsers block Firestore's default streaming connection; let it fall back to plain polling by itself.
  try{ fs.settings({ experimentalAutoDetectLongPolling: true, merge: true }); }catch(e){}
  try{ fs.enablePersistence({ synchronizeTabs: true }).catch(function(){}); }catch(e){}
  var resolveDb;
  var ready = new Promise(function(r){ resolveDb = r; });
  // Firestore refuses "undefined" values; the page only ever stores plain JSON, so drop them before every write.
  function clean(d){ return JSON.parse(JSON.stringify(d)); }
  function wrapDoc(ref){
    return {
      id: ref.id,
      set: function(d){ return ref.set(clean(d)); },
      update: function(d){ return ref.update(clean(d)); },
      delete: function(){ return ref.delete(); },
      onSnapshot: function(a, b){ return ref.onSnapshot(a, b); }
    };
  }
  function wrapCol(col){
    return {
      doc: function(id){ return wrapDoc(id ? col.doc(id) : col.doc()); },
      limit: function(n){ return wrapCol(col.limit(n)); },
      orderBy: function(f, dir){ return wrapCol(col.orderBy(f, dir)); },
      onSnapshot: function(a, b){ return col.onSnapshot(a, b); }
    };
  }
  function makeDb(user){
    var root = fs.collection("users").doc(user.uid);
    return {
      collection: function(name){ return wrapCol(root.collection(name)); },
      doc: function(path){ return wrapDoc(fs.doc("users/" + user.uid + "/" + path)); }
    };
  }
  var firstResolve, first = new Promise(function(r){ firstResolve = r; });
  window.__fbAuth = {
    user: null,
    state: null, // null until the sign-in check has answered, then "in" or "out"
    first: first,
    onChange: null,
    signIn: function(){
      var p = new firebase.auth.GoogleAuthProvider();
      if(p.setCustomParameters) p.setCustomParameters({ prompt: "select_account" });
      return auth.signInWithPopup(p);
    },
    signOut: function(){ return auth.signOut(); }
  };
  auth.onAuthStateChanged(function(user){
    window.__fbAuth.user = user || null;
    window.__fbAuth.state = user ? "in" : "out";
    if(user) resolveDb(makeDb(user));
    firstResolve(user ? "in" : "out");
    if(typeof window.__fbAuth.onChange === "function") window.__fbAuth.onChange(user || null);

<script>
/* Runs before anything else (even before the stylesheet below). It only
   pre-sets dark/light mode from the local cache, if any — the theme COLOR
   itself is intentionally left alone here and is applied later by the main
   script's applyThemeColor(), because #bootVeil (see its CSS/JS further
   down) already keeps the whole page hidden until that real value is
   confirmed, so there is nothing for this early script to usefully guess at
   for color. */
(function(){
  try{
    var raw = localStorage.getItem("home-system-settings-v3");
    if(!raw) return;
    var s = JSON.parse(raw);
    if(s.themeMode === "dark") document.documentElement.setAttribute("data-theme", "dark");
  }catch(e){}
})();
</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
@font-face{
  font-family:"Yozai";
  src:url("assets/Yozai-Regular.ttf") format("truetype");
  /* block (not swap): the greeting line is already left blank until a beat
     after the boot splash lifts (see updateBrandTitle()/liftBootVeil()), so
     by the time it's shown this font has almost certainly finished loading
     — block just makes sure it never flashes the fallback font first and
     then jumps to this one. */
  font-weight:400;font-style:normal;font-display:block;
}
:root{
  --bg:#FFFFFF;
  --surface:#ffffff;
  --surface-2:#fffdf6;
  --ink:#272727;
  --ink-soft:#726a5c;
  --ink-faint:#a89d8a;
  --line:#e6dcc9;
  --line-strong:#d8cbb0;
  --accent:#d9691f;
  --accent-ink:#ffffff;
  --accent-4-ink:#272727;
  --accent-soft:#f6e1c6;
  --rail:#2c6470;
  --rail-soft:#dcebe9;
  --good:#2f7d54;
  --good-soft:#dcefe0;
  --warn:#a8791f;
  --warn-soft:#f4e6c4;
  --bad:#ad3f2e;
  --bad-soft:#f5ded8;
  --shadow-sm:0 1px 2px rgba(33,29,24,.06);
  --shadow-md:0 10px 30px -14px rgba(33,29,24,.35);
  --radius:14px;
}
:root[data-theme="dark"]{
  --bg:#17140f; --surface:#211d16; --surface-2:#1c1912;
  --ink:#f2ece0; --ink-soft:#b3a891; --ink-faint:#7d735e;
  --line:#3a3324; --line-strong:#4a4230;
  --accent:#e88a44; --accent-ink:#1a1208; --accent-4-ink:#f2ece0; --accent-soft:#3a2a15;
  --rail:#6fb0ba; --rail-soft:#1c3236;
  --good:#63bf8d; --good-soft:#183226;
  --warn:#d9af5b; --warn-soft:#332811;
  --bad:#e2796a; --bad-soft:#3a1e18;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow-md:0 10px 30px -14px rgba(0,0,0,.6);
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  overflow:hidden;
}
.app-shell{max-width:920px;margin:0 auto;height:100%;display:flex;flex-direction:column;padding:0 16px;}
.mono{font-family:"JetBrains Mono","Noto Sans TC",monospace;font-variant-numeric:tabular-nums;}

/* fixed top chrome: title + ledger + toolbar, roughly a fifth of the screen */
.fixed-top{flex:none;display:flex;flex-direction:column;gap:10px;padding-top:16px;padding-bottom:8px;}
.scroll-area{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:32px;}

/* view-switch slide (月曆 ⇄ 清單), replays each time the view toggles
   display:none→block, so no JS re-triggering is needed */
@keyframes viewSlideInRight{ from{opacity:0;transform:translateX(26px);} to{opacity:1;transform:translateX(0);} }
@keyframes viewSlideInLeft{ from{opacity:0;transform:translateX(-26px);} to{opacity:1;transform:translateX(0);} }
.slide-in-right{animation:viewSlideInRight .46s cubic-bezier(.2,.8,.2,1);}
.slide-in-left{animation:viewSlideInLeft .46s cubic-bezier(.2,.8,.2,1);}

/* header — now a full-bleed theme-colored bar (edge-to-edge, touching the
   very top of the screen): negative margins cancel .app-shell's side
   padding and .fixed-top's top padding, then its own padding puts that
   spacing back just for the bar's own content. Logo and greeting sit
   directly on the color with no box of their own (ink-colored line art),
   so only the gear button — a distinct "tile" — contrasts against it. */
.app-header{
  display:flex;align-items:center;gap:12px;
  background:var(--accent);
  margin:-16px -16px 0;padding:14px 16px;
}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0;}
.brand-mark{width:36px;height:36px;flex:none;color:var(--ink);}
.brand-mark svg{width:100%;height:100%;display:block;}
.brand h1{
  flex:1;min-width:0;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;font-weight:700;font-size:19px;margin:0;letter-spacing:.02em;
  color:var(--ink);
}
/* dark mode: the header band is the theme's own fill colour, so its text/logo follow that fill */
:root[data-theme="dark"] .brand h1,:root[data-theme="dark"] .brand-mark{color:var(--accent-ink);}
.type-ch{display:inline-block;opacity:0;animation:typeIn .4s cubic-bezier(.2,.8,.2,1) forwards;}
@keyframes typeIn{from{opacity:0;transform:translateY(3px);}to{opacity:1;transform:translateY(0);}}
@media (prefers-reduced-motion: reduce){
  .type-ch{animation:none;opacity:1;}
}
.header-actions{display:flex;align-items:center;gap:8px;flex:none;}
.gear-btn{
  width:36px;height:36px;border-radius:10px;border:none;background:var(--surface);
  color:var(--ink-soft);cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none;
  box-shadow:var(--shadow-sm);
}
.gear-btn:hover{background:var(--surface-2);color:var(--ink);}

/* Bottom-right "新增" FAB + its 3 satellites (sun-ray fan-out). Each
   satellite sits at the SAME resting spot as the main button (right:6px;
   bottom:6px, centering its 44px circle inside the 56px main button) and
   only becomes visible + moves once .fab-wrap has .open, so opening reads
   as three little suns bursting outward from the button rather than sliding
   in from off-screen. --dx/--dy (set inline per satellite) are the arc
   offsets — 0/-108 (straight up), -76/-76 (up-left), -108/0 (straight left),
   i.e. three evenly-spaced points across a 90° quarter-circle of radius
   ~108px anchored at the button (wide enough that the label pills clear
   both each other and the calendar behind them). --fab-i (0/1/2) staggers
   the pop-in by 0.1s per item for the "有節奏" rhythm. */
.fab-wrap{
  position:fixed;right:20px;bottom:calc(22px + env(safe-area-inset-bottom,0px));
  width:56px;height:56px;z-index:40;
}
.fab-main{
  position:absolute;inset:0;width:56px;height:56px;border-radius:50%;border:none;
  background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow-md);
  display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2;
}
.fab-main:active{transform:scale(.96);}
.fab-main svg{transition:transform .25s cubic-bezier(.34,1.56,.64,1);}
.fab-wrap.open .fab-main svg{transform:rotate(45deg);}
.fab-satellite{
  position:absolute;right:6px;bottom:6px;
  display:flex;flex-direction:column;align-items:center;gap:5px;
  opacity:0;pointer-events:none;
  transform:translate(0,0) scale(.3);
  transition:transform .3s cubic-bezier(.34,1.56,.64,1), opacity .18s ease;
}
.fab-wrap.open .fab-satellite{
  opacity:1;pointer-events:auto;
  transform:translate(var(--dx),var(--dy)) scale(1);
  transition-delay:calc(var(--fab-i, 0) * 0.1s);
}
.fab-label{
  font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);
  padding:4px 10px;border-radius:999px;white-space:nowrap;box-shadow:var(--shadow-sm);
}
.fab-icon-btn{
  width:44px;height:44px;border-radius:50%;border:none;background:var(--surface);
  color:var(--ink);box-shadow:var(--shadow-sm);display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex:none;
}
.fab-icon-btn:hover{background:var(--surface-2);}
.fab-scrim{position:fixed;inset:0;z-index:39;background:transparent;}

/* ledger (the accounting area: 4 editable tiles) */
.ledger{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.ledger-tile{
  background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:7px 10px;box-shadow:var(--shadow-sm);min-width:0;
  display:flex;flex-direction:column;gap:2px;
}
.ledger-tile .k{font-size:10px;color:var(--ink-faint);font-weight:600;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ledger-tile .v{font-size:14px;font-weight:700;font-family:"JetBrains Mono","Noto Sans TC",monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ledger-tile .v.money{color:var(--ink);}
.ledger-tile .v.count{color:var(--accent);}
.ledger.ledger-2{grid-template-columns:repeat(2,1fr);}
@media (max-width:520px){
  .ledger{grid-template-columns:repeat(2,1fr);}
  .ledger-tile{flex-direction:row;align-items:center;justify-content:space-between;gap:8px;}
  .ledger-tile .k{flex:1;min-width:0;}
  .ledger-tile .v{font-size:16px;flex:none;}
}

/* ledger collapse — the grid-template-rows 1fr→0fr trick collapses the
   tiles smoothly without ever needing a measured pixel height in JS, and
   because it's ordinary block flow (nothing absolutely positioned), the
   calendar underneath just flows up to fill the freed space on its own. */
.ledger-collapse{display:grid;grid-template-rows:1fr;transition:grid-template-rows .6s cubic-bezier(.2,.8,.2,1);}
.ledger-collapse.collapsed{grid-template-rows:0fr;}
.ledger-collapse-inner{overflow:hidden;min-height:0;}
.ledger-toggle{
  display:flex;align-items:center;justify-content:center;width:100%;height:14px;margin:-7px 0;
  padding:0;background:none;border:none;color:var(--ink-faint);cursor:pointer;
}
.ledger-toggle:active{color:var(--ink-soft);}
.ledger-toggle svg{width:14px;height:14px;display:block;transition:transform .6s cubic-bezier(.2,.8,.2,1);}
.ledger-collapse.collapsed + .ledger-toggle svg{transform:rotate(180deg);}

/* toolbar */
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.toolbar .legend{flex:1;min-width:0;}
.view-toggle{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;}
.view-toggle button{
  border:none;background:transparent;padding:6px 14px;border-radius:999px;font-size:13px;
  font-weight:600;color:var(--ink-soft);cursor:pointer;font-family:inherit;
  transition:background-color .25s ease,color .25s ease,transform .15s ease;
}
.view-toggle button.active{background:var(--accent);color:var(--accent-ink);}
.view-toggle button:active{transform:scale(.94);}

/* legend */
.legend{display:flex;align-items:center;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--ink-soft);padding:0 2px;}
.legend-note{color:var(--bad);opacity:.85;font-weight:600;}
.today-btn{
  width:auto;padding:4px 11px;font-size:12px;font-weight:700;border-radius:999px;
  color:var(--accent);background:var(--accent-soft);border:none;cursor:pointer;flex:none;
}
.today-btn:hover{filter:brightness(0.96);}
.year-label{
  font-size:22px;font-weight:700;color:var(--accent);letter-spacing:.02em;
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
/* continuous calendar */
.cal-weekdays{
  display:grid;grid-template-columns:repeat(7,minmax(0,1fr));
  border-bottom:1px solid var(--accent-soft);
  position:sticky;top:0;z-index:5;background:var(--bg);
}
.cal-weekdays div{text-align:center;font-size:10px;font-weight:600;color:var(--ink-faint);padding:6px 0 8px;letter-spacing:.04em;}
.cal-months{background:transparent;}
.month-block{margin-top:22px;}
.month-block:first-child{margin-top:6px;}
.month-block .month-label{
  padding:0 2px 10px;font-size:22px;font-weight:700;color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
.cal-grid-wrap{position:relative;}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));}
.month-sticker-layer{position:absolute;inset:0;pointer-events:none;z-index:6;}
.stk{
  --stk-border:var(--accent);--stk-fill:var(--accent-soft);
  position:absolute;pointer-events:auto;touch-action:none;cursor:grab;
  display:flex;align-items:center;justify-content:center;
  min-width:36px;min-height:22px;user-select:none;-webkit-user-select:none;
  -webkit-touch-callout:none;-webkit-user-drag:none;
  transform:translate(-50%,-50%) rotate(var(--rot,0deg));
}
.stk:active{cursor:grabbing;}
/* The shape itself is one SVG element (rect/ellipse/polygon) rather than a
   CSS clip-path: an SVG stroke correctly follows any path — including a
   spiky star or a notched ribbon — with a clean, uniform width all the way
   around, which a `border` (or the old clipped-div trick) cannot do. The
   stretch from resizing to an arbitrary width/height is absorbed by the
   viewBox (preserveAspectRatio="none"), while vector-effect keeps the
   stroke itself a constant on-screen thickness regardless of that stretch. */
.stk-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;z-index:0;}
.stk-shape-el{fill:var(--stk-fill);fill-opacity:var(--stk-op,1);stroke:none;}
.stk-text{
  position:relative;z-index:1;color:var(--stk-text,var(--ink));opacity:var(--stk-text-op,1);font-size:12px;font-weight:700;
  text-align:center;line-height:1.2;padding:5px 12px;word-break:break-word;pointer-events:none;
  max-width:100%;
}
/* No drop-shadow effect at all, in any state (idle, active, or dragging).
   On this device, WebKit's `filter` (drop-shadow) leaves a stale rendered
   copy of itself behind whenever the class that applies it is added or
   removed — scoping it to just the shape (.stk-svg, not .stk) still didn't
   stop it. Rather than keep chasing that repaint bug, the sticker simply
   never uses `filter`, on the shape or its container: it's a flat shape
   (border + fill) at rest, and while .active (the editing session opened by
   a long-press) it still shows the small floating toolbar above it — not
   attached to its corners, so it never fights with the shape's own outline
   — just without any lift effect. .resizing is a sub-state, toggled from
   that toolbar, that additionally reveals the resize + rotate handles. */
.stk-toolbar{
  position:absolute;left:50%;top:-40px;display:none;gap:5px;
  background:var(--surface);border:1px solid var(--line);border-radius:999px;
  padding:4px;box-shadow:var(--shadow-md);z-index:3;
  /* counter-rotate so the toolbar stays upright even when the sticker itself is tilted */
  transform:translateX(-50%) rotate(calc(-1 * var(--rot,0deg)));
}
.stk.active .stk-toolbar{display:flex;}
.stk-tb-btn{
  width:24px;height:24px;border-radius:50%;border:none;
  font-size:12px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;
}
.stk-confirm{background:var(--good);color:#fff;font-size:13px;}
.stk-del{background:var(--bad);color:#fff;}
.stk-edit{background:var(--accent);color:var(--accent-ink);font-size:11px;}
.stk-resizetoggle{background:var(--surface-2);color:var(--ink-soft);font-size:11px;}
.stk.resizing .stk-resizetoggle{background:var(--accent);color:var(--accent-ink);}
.stk-handle{
  position:absolute;width:20px;height:20px;border-radius:50%;background:var(--surface);
  border:2px solid var(--accent);display:none;z-index:3;
}
.stk.resizing .stk-handle{display:block;}
.stk-resize{right:-10px;bottom:-10px;cursor:nwse-resize;}
.stk-rotate{left:50%;top:-30px;margin-left:-10px;cursor:grab;}
.stk-rotate::after{
  content:"";position:absolute;left:50%;top:100%;width:1px;height:12px;background:var(--accent);transform:translateX(-50%);
}
.cal-cell{
  min-height:84px;border-bottom:1px solid var(--line);overflow:visible;min-width:0;
  padding:8px 4px 6px;display:flex;flex-direction:column;gap:5px;cursor:pointer;position:relative;
}
.cal-cell:hover{background:var(--surface-2);}
.cal-cell.out-month{background:transparent;cursor:default;border-bottom-color:transparent;}
.cal-cell.out-month:hover{background:transparent;}
.cal-cell.sticker-editing{outline:2px dashed var(--accent);outline-offset:-2px;background:var(--accent-soft);z-index:3;}
.daynum{font-size:16px;font-weight:600;color:var(--ink);font-family:"Noto Sans TC",sans-serif;width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:50%;flex:none;}
.cal-cell.is-dayoff .daynum{color:var(--c4-text,var(--line-strong));}
.cell-top{display:flex;align-items:center;justify-content:center;gap:6px;min-width:0;position:relative;z-index:1;}
.holiday-name{font-size:10px;font-weight:500;color:var(--bad);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;opacity:.85;}
.cal-cell.is-today .daynum{
  background:var(--accent);color:#fff;font-weight:700;
  text-shadow:0 0 2px rgba(0,0,0,.18);
}
.cal-cell.is-today.is-dayoff .daynum{
  background:var(--line-strong);color:var(--accent-4-ink);text-shadow:none;
}.badge{
  --rot:0deg;
  position:absolute;min-width:32px;height:32px;padding:0 3px;font-size:27px;font-weight:700;
  line-height:32px;text-align:center;cursor:pointer;background:transparent;touch-action:none;z-index:2;
  transition:transform .12s ease;
  transform:translate(-50%,-50%) rotate(var(--rot));
  user-select:none;-webkit-user-select:none;-webkit-user-drag:none;-webkit-touch-callout:none;
}
.badge.badge-dragging{transform:translate(-50%,-50%) translateY(-6px) rotate(0deg) scale(1.35);z-index:4;}
.badge::after{

/* modal (shared) */
.overlay{

}
@media (min-width:640px){ .overlay{align-items:center;padding:20px;} }
.modal{
  background:var(--surface);width:100%;max-width:560px;border-radius:18px 18px 0 0;
  max-height:92vh;overflow-y:auto;overflow-x:hidden;box-shadow:var(--shadow-md);
}
.modal-body,.modal-body *{min-width:0;}
@media (min-width:640px){ .modal{border-radius:18px;} }
.modal.small{max-width:400px;}
#onboardingOverlay,#settingsOverlay,#logoutConfirmOverlay,#labelEditOverlay,#purgeOverlay{align-items:center;padding:20px;}
#onboardingOverlay .modal,#settingsOverlay .modal,#logoutConfirmOverlay .modal,#labelEditOverlay .modal,#purgeOverlay .modal{border-radius:18px;}
#logoutConfirmOverlay,#labelEditOverlay,#purgeOverlay{z-index:60;}

/* modal entrance motion — replays every time an overlay's `hidden` toggles
   off, since display:none→block resets a running CSS animation for free.
   Uses margin-top (not transform) to slide, because .modal is the
   scrolling container for a position:sticky header/footer — animating
   `transform` on it briefly changes the sticky containing block, which is
   exactly what made the footer button visibly hop into place once the
   animation ended. margin-top has no such side effect. */
@keyframes overlayFadeIn{ from{opacity:0;} to{opacity:1;} }
@keyframes modalSlideUp{ from{opacity:0;margin-top:28px;} to{opacity:1;margin-top:0;} }
@keyframes modalPopIn{ from{opacity:0;margin-top:14px;} to{opacity:1;margin-top:0;} }
.overlay{animation:overlayFadeIn .2s ease;}
.modal{animation:modalSlideUp .3s cubic-bezier(.2,.8,.2,1);margin-top:0;}
#onboardingOverlay .modal,#settingsOverlay .modal,#logoutConfirmOverlay .modal,#labelEditOverlay .modal,#purgeOverlay .modal{
  animation:modalPopIn .3s cubic-bezier(.2,.8,.2,1);
}
@media (prefers-reduced-motion: reduce){
  .overlay,.modal,.slide-in-right,.slide-in-left{animation:none;}
}

  /* A leg is one main transport plus (optionally) ONE transfer/feeder that
     happens either before it (e.g. 台鐵 to the 高鐵 station, then 高鐵) or after
     it. `segments` is kept in the order the person actually travels; the main
     one is flagged isMain (older saved legs have no flag → index 0 is main). */
  function splitSegs(leg){
    var segs = (leg && leg.segments) || [];
    var mi = 0;
    for(var i=0;i<segs.length;i++){ if(segs[i] && segs[i].isMain){ mi = i; break; } }
    var ti = -1;
    for(var j=0;j<segs.length;j++){ if(j !== mi){ ti = j; break; } }
    return { main: segs[mi] || null, transfer: ti >= 0 ? segs[ti] : null, pos: (ti >= 0 && ti < mi) ? "before" : "after" };
  }
  /* the leg's overall span is simply the earliest departure and the latest
     arrival across all of its segments, wherever the transfer sits */
  function legTimeRange(leg){
    var segs = leg.segments || [];
    if(!segs.length) return { start:"--:--", end:"--:--" };
    var deps = segs.map(function(s){ return s.depart; }).filter(Boolean).sort();
    var arrs = segs.map(function(s){ return s.arrive; }).filter(Boolean).sort();
    return { start: deps.length ? deps[0] : "--:--", end: arrs.length ? arrs[arrs.length-1] : "--:--" };
  }
  /* small calendar badge: a custom 1-2 character label the user typed, or an

  function legTag(leg){

    if(custom) return custom.slice(0,2);

    var meta = seg0 ? (modes[seg0.mode] || modes.other) : modes.other;
    return meta.icon;
  }
  /* freeform "sticker" placement on the calendar: a leg can carry its own

     spots so they don't all land exactly on top of each other. */
  var STICKER_CLAMP_MIN = 0.14, STICKER_CLAMP_MAX = 0.86;
  var DEFAULT_STICKER_SPOTS = [
    {x:.5,y:.6},{x:.28,y:.42},{x:.72,y:.42},{x:.28,y:.8},{x:.72,y:.8},{x:.5,y:.85}
  ];
  function clampPct(v){ return Math.max(STICKER_CLAMP_MIN, Math.min(STICKER_CLAMP_MAX, v)); }
  function stickerPosFor(leg, index){
    var override = demoStickerOverrides[leg.tripId+":"+leg.legIndex];
    if(override) return override;
    if(typeof leg.stickerX === "number" && typeof leg.stickerY === "number"){
      return { x: clampPct(leg.stickerX), y: clampPct(leg.stickerY) };

    return DEFAULT_STICKER_SPOTS[index % DEFAULT_STICKER_SPOTS.length];

  var demoStickerOverrides = {};
  function setLegStickerPos(tripId, legIndex, x, y){
    var trip = trips.find(function(t){ return t.id === tripId; });

      // browser session only, since there is no real document to update.

    }
    var newLegs = trip.legs.map(function(l){ return JSON.parse(JSON.stringify(l)); });
    newLegs[legIndex].stickerX = x;
    newLegs[legIndex].stickerY = y;
    dataUpdate(tripId, { type: trip.type, legs: newLegs, notes: trip.notes || "", tagLabel: trip.tagLabel || "" });
  }
  function computeMetric(id, monthLegs){
    switch(id){
      case "unpaid_count": return monthLegs.filter(function(l){ return l.status==="unpaid"; }).length;
      case "unpaid_amount": return monthLegs.filter(function(l){ return l.status==="unpaid"; }).reduce(function(s,l){ return s+legTotal(l); },0);
      case "paid_count": return monthLegs.filter(function(l){ return l.status==="paid"; }).length;
      case "paid_amount": return monthLegs.filter(function(l){ return l.status==="paid"; }).reduce(function(s,l){ return s+legTotal(l); },0);
      case "cancelled_count": return monthLegs.filter(function(l){ return l.status==="cancelled"; }).length;
      case "cancelled_amount": return monthLegs.filter(function(l){ return l.status==="cancelled"; }).reduce(function(s,l){ return s+legTotal(l); },0);
      case "reimburse_count": return monthLegs.filter(function(l){ return l.status==="paid" && l.settleStatus!=="settled"; }).length;
      case "reimburse_amount": return monthLegs.filter(function(l){ return l.status==="paid" && l.settleStatus!=="settled"; }).reduce(function(s,l){ return s+legTotal(l); },0);
      case "trip_count": return monthLegs.filter(function(l){ return l.status!=="cancelled"; }).length;
      case "total_amount": return monthLegs.filter(function(l){ return l.status!=="cancelled"; }).reduce(function(s,l){ return s+legTotal(l); },0);

    }
  }

  var TW_HOLIDAYS = {

  /* Holidays for any year are fetched online (public Taiwan calendar data) and cached in this browser.
     The built-in table above is only the offline fallback. */
  var HOL_CACHE = {}, HOL_REQ = {};
  function holLoadCached(y){
    try{
      var raw = localStorage.getItem("home-system-hol-"+y);
      if(!raw) return;
      var o = JSON.parse(raw);
      if(o && o.m){ HOL_CACHE[y] = o.m; HOL_REQ[y] = (y < new Date().getFullYear() || (Date.now() - (o.t||0)) < 30*86400000) ? 2 : 0; }
    }catch(e){}
  }
  function holFetch(y){
    var urls = ["https://cdn.jsdelivr.net/gh/ruyut/TaiwanCalendar/data/"+y+".json",
                "https://raw.githubusercontent.com/ruyut/TaiwanCalendar/master/data/"+y+".json"];
    function tryUrl(i){
      if(i >= urls.length) return;
      var ctl = (typeof AbortController !== "undefined") ? new AbortController() : null;
      var tm = setTimeout(function(){ if(ctl) ctl.abort(); }, 8000);
      fetch(urls[i], ctl ? { signal: ctl.signal } : undefined).then(function(r){
        clearTimeout(tm);
        if(!r.ok) throw new Error("http "+r.status);
        return r.json();
      }).then(function(arr){
        if(!Array.isArray(arr) || !arr.length) throw new Error("bad data");
        var m = {};
        arr.forEach(function(it){
          if(it && it.isHoliday && it.description && /^\d{8}$/.test(String(it.date))){
            var d = String(it.date);
            m[d.slice(0,4)+"-"+d.slice(4,6)+"-"+d.slice(6,8)] = it.description;
          }
        });
        HOL_CACHE[y] = m;
        try{ localStorage.setItem("home-system-hol-"+y, JSON.stringify({ t: Date.now(), m: m })); }catch(e){}
        if(typeof notify === "function") notify();
      }).catch(function(){ clearTimeout(tm); tryUrl(i+1); });
    }
    tryUrl(0);
  }
  function holidayName(ds){
    var y = Number(String(ds).slice(0,4));
    if(!(y in HOL_REQ) || HOL_REQ[y] === 0){
      if(!(y in HOL_REQ)) holLoadCached(y);
      if(!HOL_REQ[y]){ HOL_REQ[y] = 1; if(typeof fetch === "function") holFetch(y); }
    }
    if(HOL_CACHE[y]) return HOL_CACHE[y][ds] || null;
    if(TW_HOLIDAYS[ds]) return TW_HOLIDAYS[ds];
    if(y > 2026){ var md = String(ds).slice(5); if(md==="01-01") return "元旦"; if(md==="02-28") return "和平紀念日"; if(md==="05-01") return "勞動節"; if(md==="10-10") return "國慶日"; }
    return null;
  }
  (function(){ var y = new Date().getFullYear(); holidayName(y+"-01-01"); holidayName((y+1)+"-01-01"); })();
  function fmtMoney(n){ n = Number(n)||0; return "NT$ " + n.toLocaleString("en-US"); }
  function shortCity(name){
    name = (name||"").trim();

  function greetingWord(){

  var greetingAnimated = false; // the typewriter reveal only ever plays once

                                 // settings change (theme color, name, etc.)

  function updateBrandTitle(){
    var el = document.getElementById("brandTitle");
    if(!el) return;
    // No login system yet, so this is just the profile nickname for now —
    // once accounts exist, the logged-in account's display name shows here
    // the same way.
    var name = (settings.profileName || "").trim() || "你";
    var greeting = greetingWord();
    var full = greeting + "，" + name;
    // While the boot splash is still covering the screen, don't fill this in
    // yet — it would just finish typing out unseen behind the veil, and the
    // person would see the final text sitting there with no animation the
    // moment the veil lifts. Leave it blank; liftBootVeil() calls this again
    // for real once the screen has been visible for a beat.
    if(document.getElementById("bootVeil")){ el.textContent = ""; return; }
    if(greetingAnimated){ el.textContent = full; return; }
    greetingAnimated = true;
    // Typewriter reveal: each character of the greeting word types in at a
    // steady beat, then a slightly longer pause before "，" + the name types
    // in right after — a little rhythm rather than everything popping at once.
    var CHAR_MS = 150;
    var PAUSE_MS = 280;
    var html = "";
    var t = 90; // a short lead-in before the first character, so it eases in
                // instead of popping at time zero
    for(var i=0;i<full.length;i++){
      if(i === greeting.length) t += PAUSE_MS;
      html += '<span class="type-ch" style="animation-delay:'+t+'ms">'+escapeHtml(full[i])+'</span>';
      t += CHAR_MS;
    }
    el.innerHTML = html;
  }
  var ledgerCollapsed = false;

  /* Splash screen: #bootVeil (see its CSS) shows the logo + app name with a
     short rise-and-fade-in animation, holds briefly so the animation is
     actually seen even on a fast connection, then fades out and is removed —
     revealing either the onboarding screen or the main calendar underneath,
     whichever settings.onboarded calls for. BOOT_MIN_MS is that minimum
     display time; if real data takes longer than that to arrive, the veil
     just waits for it instead of cutting the animation short. */
  var bootVeilLifted = false;
  var bootRevealed = false;

  var BOOT_REVEAL_MIN_MS = 380; // the logo only turns .reveal (see its CSS) once
                                 // the theme color is confirmed, so this just
                                 // guarantees it's actually glimpsed even when

    if(bootRevealed) return;

  function liftBootVeil(){
    if(bootVeilLifted) return;
    bootVeilLifted = true;
    var veil = document.getElementById("bootVeil");
    if(!veil) return;
    var wait = Math.max(BOOT_MIN_MS - (Date.now() - bootStartedAt), BOOT_REVEAL_MIN_MS);
    setTimeout(function(){
      veil.classList.add("veil-out");
      setTimeout(function(){
        veil.remove();
        // updateBrandTitle() left the header blank while this veil was up
        // (see its own comment) so there's nothing to reveal early. Give the
        // screen a brief beat to settle before the greeting types in.
        setTimeout(updateBrandTitle, 1000);

  function loadLocalSettings(){

    mint:{ d1:"#b9e4d6", d2:"#505d55", d3:"#5b5148", d4:"#545585", f:"#9195fa" }

  function hexToRgb(hex){
    var m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec((hex||"").trim());
    if(!m) return {r:217,g:105,b:31};
    return { r:parseInt(m[1],16), g:parseInt(m[2],16), b:parseInt(m[3],16) };
  }
  function rgbToHex(c){
    function h(n){ return Math.max(0,Math.min(255,Math.round(n))).toString(16).padStart(2,"0"); }
    return "#"+h(c.r)+h(c.g)+h(c.b);
  }
  function mixHex(hexA, hexB, t){
    var a = hexToRgb(hexA), b = hexToRgb(hexB);
    return rgbToHex({ r:a.r+(b.r-a.r)*t, g:a.g+(b.g-a.g)*t, b:a.b+(b.b-a.b)*t });
  }
  function relLuminance(hex){
    var c = hexToRgb(hex);
    function lin(v){ v/=255; return v<=0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4); }
    return 0.2126*lin(c.r)+0.7152*lin(c.g)+0.0722*lin(c.b);
  }
  function isDarkThemeActive(){
    // Dark mode is always a manual, per-account choice here — it never follows
    // the phone/OS "prefers-color-scheme" setting, on purpose (so everyone who
    // opens the same link sees the same thing regardless of their own device).
    return document.documentElement.getAttribute("data-theme") === "dark";

  function applyThemeMode(){
    document.documentElement.setAttribute("data-theme", settings.themeMode === "dark" ? "dark" : "light");
    applyThemeColor();
  }
  function themePresetFor(key){
    var found = THEME_PRESETS.find(function(p){ return p.key === key; });
    return found || THEME_PRESETS[0];
  }
  function contrastRatio(a, b){
    var x = relLuminance(a), y = relLuminance(b);
    return (Math.max(x,y)+.05) / (Math.min(x,y)+.05);
  }
  function applyThemeColor(){
    var preset = themePresetFor(settings.themeColor);
    var root = document.documentElement.style;
    var dk = isDarkThemeActive();
    var dp = dk ? (DARK_PRESETS[preset.key] || DARK_PRESETS.yellow) : null;
    function inkFor(bg){ return contrastRatio("#1a1208", bg) >= contrastRatio("#ffffff", bg) ? (dk ? "#1a1208" : "#272727") : "#ffffff"; }
    var c1 = dk ? dp.d1 : preset.c1, c2 = dk ? dp.d2 : preset.c2, c3 = dk ? dp.d3 : preset.c3, c4 = dk ? dp.d4 : preset.c4;
    var ink = dk ? inkFor(c1) : (relLuminance(preset.c1) > 0.5 ? "#272727" : "#ffffff");
    var ink4 = dk ? inkFor(c4) : (relLuminance(preset.c4) > 0.5 ? "#272727" : "#ffffff");
    root.setProperty("--accent", c1);
    root.setProperty("--accent-soft", c2);
    root.setProperty("--accent-3", c3);
    root.setProperty("--accent-4", c4);
    root.setProperty("--accent-ink", ink);
    root.setProperty("--stub-ink", (!dk && contrastRatio("#272727", preset.c1) >= 3.5) ? "#272727" : ink);
    root.setProperty("--accent-4-ink", ink4);
    // readable text colours for the places that sit on colour 2 / colour 3
    var cInk = dk ? "#f2ece0" : "#272727", cSoft = dk ? "#b3a891" : "#726a5c";
    function pickText(bg, list){
      var best = list[0], bestR = 0;
      for(var i=0;i<list.length;i++){
        var r = contrastRatio(list[i], bg);
        if(r >= 4.2) return list[i];
        if(r > bestR){ best = list[i]; bestR = r; }
      }
      return best;
    }
    root.setProperty("--on-c2", pickText(c2, [cSoft, cInk, "#272727"]));
    root.setProperty("--on-c2-ink", pickText(c2, [cInk, "#272727"]));
    // best text colour on the colour-4 fill (single-trip tickets)
    var c4Cands = dk ? ["#f2ece0", "#ffffff", "#1a1208"] : ["#272727", "#ffffff"], c4Best = c4Cands[0], c4R = 0;
    c4Cands.forEach(function(cc){ var rr = contrastRatio(cc, c4); if(rr > c4R){ c4Best = cc; c4R = rr; } });
    root.setProperty("--on-c4", c4Best);
    root.setProperty("--on-c3", pickText(c3, [cSoft, cInk, "#272727", "#ffffff"]));
    root.setProperty("--line", c3);
    root.setProperty("--line-strong", c4);
    root.setProperty("--ink-faint", dk ? dp.f : preset.c4);

  }

  /* ---------------- data layer (db capability, localStorage fallback) ---------------- */
  var TRIPS_LOCAL_KEY = "home-system-trips-v2";
  var listeners = [];
  var trips = [];
  var dbApi = null;
  var settingsDbApi = null;
  var usingFallback = false;
  var loginMode = false; // hosted version: not signed in yet -> splash, then the welcome window asks for Google login

  function notify(){ listeners.forEach(function(fn){ fn(trips); }); }
  function onTrips(fn){ listeners.push(fn); fn(trips); }

  function loadLocalTrips(){
    try{ var raw = localStorage.getItem(TRIPS_LOCAL_KEY); trips = raw ? JSON.parse(raw) : []; }
    catch(e){ trips = []; }
    notify();
  }
  function saveLocalTrips(){ try{ localStorage.setItem(TRIPS_LOCAL_KEY, JSON.stringify(trips)); }catch(e){} }

  /* The database confirms a write, and pushes it back through onSnapshot, only
     after a delay (on some connections up to ~30s). Waiting for that made a
     freshly saved trip look like it had not been saved at all — which is how
     the same trip ended up saved two or three times. So every write is shown
     at once here ("pending"), and each snapshot is topped up with whatever is
     still pending until the database itself reports it. */
  var pendingAdds = {}, pendingUpdates = {}, pendingDeletes = {};
  function applyPending(list){
    var now = Date.now(), ids = {};
    list.forEach(function(t){ ids[t.id] = 1; });
    Object.keys(pendingAdds).forEach(function(id){
      var p = pendingAdds[id];
      if(ids[id] || now - p.t > 30000){ delete pendingAdds[id]; }
      else { list.push(p.doc); }
    });
    Object.keys(pendingUpdates).forEach(function(id){
      var p = pendingUpdates[id];
      if(now - p.t > 15000){ delete pendingUpdates[id]; return; }
      for(var i=0;i<list.length;i++){
        if(list[i].id === id){ list[i] = Object.assign({}, list[i], p.data, { id: id }); }
      }
    });
    Object.keys(pendingDeletes).forEach(function(id){
      if(!ids[id] || now - pendingDeletes[id] > 30000){ delete pendingDeletes[id]; return; }
      for(var i=list.length-1;i>=0;i--){ if(list[i].id === id) list.splice(i,1); }
    });
    return list;
  }
  function dataAdd(data){
    data.createdAt = Date.now();
    if(dbApi && !usingFallback){
      var ref = dbApi.collection("trips").doc();
      var local = Object.assign({}, data, { id: ref.id });
      pendingAdds[ref.id] = { doc: local, t: Date.now() };
      trips.push(local); notify();
      return ref.set(data).then(function(){ return true; }, function(){
        delete pendingAdds[ref.id];
        trips = trips.filter(function(x){ return x.id !== ref.id; });
        notify();
        return false;
      });
    }
    data.id = uid();
    trips.push(data); saveLocalTrips(); notify();
    return Promise.resolve();
  }
  function dataUpdate(id, data){
    if(dbApi && !usingFallback){
      pendingUpdates[id] = { data: data, t: Date.now() };
      var cur = trips.find(function(x){ return x.id === id; });
      if(cur) Object.assign(cur, data);
      notify();
      return dbApi.doc("trips/"+id).set(data).then(function(){ return true; }, function(){ delete pendingUpdates[id]; return false; });
    }
    var t = trips.find(function(x){ return x.id === id; });
    if(t) Object.assign(t, data);
    saveLocalTrips(); notify();
    return Promise.resolve();
  }
  function dataDelete(id){
    if(dbApi && !usingFallback){
      pendingDeletes[id] = Date.now();
      trips = trips.filter(function(x){ return x.id !== id; });
      notify();
      return dbApi.doc("trips/"+id).delete().then(function(){ return true; }, function(){ delete pendingDeletes[id]; return false; });
    }
    trips = trips.filter(function(x){ return x.id !== id; });
    saveLocalTrips(); notify();
    return Promise.resolve();
  }
  function clearAllTrips(){
    if(dbApi && !usingFallback){
      var ids = trips.map(function(t){ return t.id; });
      return Promise.all(ids.map(function(id){ return dbApi.doc("trips/"+id).delete().catch(function(){}); }));
    }
    trips = [];
    saveLocalTrips(); notify();
    return Promise.resolve();
  }

  /* ---------------- calendar sticker "labels" (whole-month decorative stickers) ---------------- */
  /* While a finger is down on a sticker, a snapshot-triggered re-render would
     destroy the element being dragged. Hold renders until the press ends. */
  var renderGate = { busy:false, pending:false, timer:null };
  function gateOn(){
    renderGate.busy = true;
    clearTimeout(renderGate.timer);
    renderGate.timer = setTimeout(gateOff, 10000); // safety: never block rendering for long
  }
  function gateOff(){
    clearTimeout(renderGate.timer);
    if(!renderGate.busy) return;
    renderGate.busy = false;
    if(renderGate.pending){ renderGate.pending = false; setTimeout(function(){ renderAll(trips); }, 0); }
  }
  var LABELS_LOCAL_KEY = "home-system-labels-v1";
  var labels = [];
  var labelListeners = [];
  function notifyLabels(){ labelListeners.forEach(function(fn){ fn(labels); }); }
  function onLabels(fn){ labelListeners.push(fn); fn(labels); }
  function loadLocalLabels(){
    try{ var raw = localStorage.getItem(LABELS_LOCAL_KEY); labels = raw ? JSON.parse(raw) : []; }
    catch(e){ labels = []; }
    notifyLabels();
  }
  function saveLocalLabels(){ try{ localStorage.setItem(LABELS_LOCAL_KEY, JSON.stringify(labels)); }catch(e){} }
  var labelPending = {};
  function labelPersist(l){
    labelPending[l.id] = { l: JSON.parse(JSON.stringify(l)), t: Date.now() };
    if(dbApi && !usingFallback){ dbApi.doc("labels/"+l.id).set(l).catch(function(){}); }
    else { saveLocalLabels(); }
  }
  function labelAdd(ym){
    var l = { id: uid("lbl"), ym: ym, x:50, y:42, w:26, h:20, rot:0, shape:"highlight", text:"標籤", createdAt: Date.now() };
    labels.push(l);

  function labelPatch(id, patch){
    var l = labels.find(function(x){ return x.id === id; });
    if(!l) return;
    var nl = Object.assign({}, l, patch);
    labels = labels.map(function(x){ return x.id === id ? nl : x; });
    l = nl;
    notifyLabels();
    labelPersist(l);
  }
  function labelDelete(id){
    labelPending[id] = { del:true, t: Date.now() };
    labels = labels.filter(function(x){ return x.id !== id; });
    notifyLabels();
    if(dbApi && !usingFallback){ dbApi.doc("labels/"+id).delete().catch(function(){}); }

  /* One-time rescue: an earlier build could silently fall back to this device's own storage, so trips
     (and stickers) entered then exist only here. On the first real (server) answer, if the cloud has
     no trips yet, copy them up once, then park the local copy under a backup key so they can't be
     copied into a different account later. */
  /* A small "connecting" pill, shown only if the cloud is slow to answer at start-up. */
  /* Two tiny health checks run at start-up so the "connecting" message can say what is actually wrong:
     is the phone's own storage (IndexedDB, used by the sign-in and the database) answering, and can the
     Google servers be reached at all? */
  var idbProbe = "wait", netProbe = "wait";
  try{
    var rq = indexedDB.open("home-probe");
    rq.onsuccess = function(){ idbProbe = "ok"; try{ rq.result.close(); indexedDB.deleteDatabase("home-probe"); }catch(e){} };
    rq.onerror = function(){ idbProbe = "bad"; };
    rq.onblocked = function(){ idbProbe = "bad"; };
  }catch(e){ idbProbe = "bad"; }
  try{
    var ctl = ("AbortController" in window) ? new AbortController() : null;
    var tm = setTimeout(function(){ if(netProbe === "wait"){ netProbe = "bad"; if(ctl) ctl.abort(); } }, 6000);
    fetch("https://firestore.googleapis.com/", { mode: "no-cors", cache: "no-store", signal: ctl ? ctl.signal : undefined })
      .then(function(){ netProbe = "ok"; clearTimeout(tm); }, function(){ netProbe = "bad"; clearTimeout(tm); });
  }catch(e){ netProbe = "bad"; }
  function syncReason(){
    var a = window.__fbAuth;
    if(!a) return "沒有雲端設定";
    if(idbProbe !== "ok") return "手機的儲存空間沒有回應";
    if(netProbe === "bad") return "連不到 Google 伺服器";
    if(!a.state) return "登入檢查沒有回應";
    if(a.state === "in") return "雲端資料庫沒有回應";
    return "尚未登入";
  }
  function showSyncHint(on){
    var el = document.getElementById("syncHint");
    if(on){
      if(!el){
        el = document.createElement("div"); el.id = "syncHint";
        el.innerHTML = '正在連線雲端…<small>' + syncReason() + '・點一下重新連線</small>';
        el.addEventListener("click", function(){ location.reload(); });
        document.body.appendChild(el);
      }
      requestAnimationFrame(function(){ el.classList.add("on"); });
    } else if(el){
      el.classList.remove("on");
      setTimeout(function(){ if(el.parentNode) el.remove(); }, 400);
    }
  }
  /* Right after a Google sign-in the app is still wearing the default theme for a moment while the
     person's saved theme and trips come down. Cover that moment with a neutral screen so the
     switch happens out of sight, then fade it away. */
  var loginCover = null;
  function loginCoverOn(){
    if(loginCover) return;
    var el = document.createElement("div"); el.id = "loginCover";
    var logo = document.querySelector(".boot-mark-icon");
    el.innerHTML = logo ? logo.innerHTML : "";
    document.body.appendChild(el);
    loginCover = { el: el, s: false, t: false, done: false };
    setTimeout(function(){ coverFinish(); }, 6000); // never hold the screen for long
  }
  function coverDone(k){
    if(!loginCover) return;
    loginCover[k] = true;
    if(loginCover.s && loginCover.t) setTimeout(coverFinish, 350);
  }
  function coverFinish(){
    if(!loginCover || loginCover.done) return;
    loginCover.done = true;
    var el = loginCover.el;
    el.classList.add("off");
    setTimeout(function(){ el.remove(); loginCover = null; }, 560);
  }
  var MIGRATED_KEY = "home-system-migrated-v1";
  function migrateLocalOnce(snap){
    try{
      if(!dbApi || usingFallback) return;
      if(snap.metadata && snap.metadata.fromCache) return;
      if(localStorage.getItem(MIGRATED_KEY)) return;
      if(snap.docs && snap.docs.length) { localStorage.setItem(MIGRATED_KEY, "skip"); return; }
      var lt = []; var ll = [];
      try{ lt = JSON.parse(localStorage.getItem(TRIPS_LOCAL_KEY) || "[]") || []; }catch(e){}
      try{ ll = JSON.parse(localStorage.getItem(LABELS_LOCAL_KEY) || "[]") || []; }catch(e){}
      lt = lt.filter(function(t){ return t && !t.demo && t.legs && t.legs.length; });
      localStorage.setItem(MIGRATED_KEY, "1");
      if(!lt.length && !ll.length) return;
      lt.forEach(function(t){
        var d = Object.assign({}, t); delete d.id; if(!d.createdAt) d.createdAt = Date.now();
        dbApi.collection("trips").doc().set(d).catch(function(){});
      });
      ll.forEach(function(l){
        if(l && l.id){ dbApi.doc("labels/"+l.id).set(l).catch(function(){}); }
      });
      try{
        localStorage.setItem(TRIPS_LOCAL_KEY + "-backup", localStorage.getItem(TRIPS_LOCAL_KEY) || "[]");
        localStorage.setItem(LABELS_LOCAL_KEY + "-backup", localStorage.getItem(LABELS_LOCAL_KEY) || "[]");
        localStorage.removeItem(TRIPS_LOCAL_KEY); localStorage.removeItem(LABELS_LOCAL_KEY);
      }catch(e){}
    }catch(e){}
  }

  function initData(){
    if(window.__fbAuth){
      window.__fbAuth.first.then(function(st){ if(st === "out"){ loginMode = true; notifySettings(); } });
    }
    if(window.claude && window.claude.use){
      window.claude.use("db").then(function(db){
        if(!db){ usingFallback = true; loadLocalTrips(); loadLocalSettings(); loadLocalLabels(); return; }
        dbApi = db;
        dbApi.collection("trips").limit(1000).onSnapshot(
          function(snap){
            migrateLocalOnce(snap);
            if(!(snap.metadata && snap.metadata.fromCache)){ showSyncHint(false); coverDone("t"); }
            trips = applyPending(snap.docs.map(function(d){ var data = Object.assign({}, d.data() || {}); data.id = d.id; return data; }));
            // trips carry their dates inside legs[], so order them here (the database has no top-level "date" field to sort by)
            trips.sort(function(a,b){
              function first(t){ var ds = (t.legs||[]).map(function(l){ return l.date||""; }).filter(Boolean).sort(); return ds[0] || ""; }
              var fa = first(a), fb = first(b);
              return fa < fb ? -1 : (fa > fb ? 1 : 0);
            });
            notify();
          },
          function(){ usingFallback = true; loadLocalTrips(); }
        );
        settingsDbApi = dbApi.doc("settings/app");
        settingsDbApi.onSnapshot(
          function(snap){
            if(snap.exists){ Object.assign(settings, snap.data()); }
            saveLocalSettings(); // refresh the cache the early inline theme-preload script reads
            notifySettings();
            if(!(snap.metadata && snap.metadata.fromCache)) coverDone("s");
          },
          function(){ loadLocalSettings(); }
        );
        dbApi.collection("labels").limit(300).onSnapshot(
          function(snap){
            var fresh = snap.docs.map(function(d){ var data = Object.assign({}, d.data() || {}); data.id = d.id; return data; });
            var now = Date.now();
            // keep local edits that the (delayed) snapshot has not caught up with yet
            Object.keys(labelPending).forEach(function(pid){
              var pe = labelPending[pid];
              var idx = -1; fresh.forEach(function(f,i){ if(f.id === pid) idx = i; });
              if(pe.del){
                if(idx < 0 || now - pe.t > 60000){ delete labelPending[pid]; }
                else { fresh.splice(idx,1); }
              } else if(idx >= 0 && JSON.stringify(fresh[idx]) === JSON.stringify(pe.l)){ delete labelPending[pid]; }
              else if(now - pe.t > 60000){ delete labelPending[pid]; }
              else if(idx >= 0){ fresh[idx] = Object.assign({}, pe.l); }
              else { fresh.push(Object.assign({}, pe.l)); }
            });
            if(JSON.stringify(fresh) === JSON.stringify(labels)) return;
            labels = fresh;
            notifyLabels();
          },
          function(){ loadLocalLabels(); }
        );
      }).catch(function(){ usingFallback = true; loadLocalTrips(); loadLocalSettings(); loadLocalLabels(); });
    } else {
      usingFallback = true; loadLocalTrips(); loadLocalSettings(); loadLocalLabels();
    }
  }

  /* ---------------- flatten trips into legs for rendering ---------------- */
  function flatLegs(list){
    var out = [];
    list.forEach(function(trip){
      var legs = trip.legs || [];
      legs.forEach(function(leg, i){
        var role = trip.type === "roundtrip" ? (i === 0 ? "outbound" : "return") : "oneway";
        out.push(Object.assign({}, leg, { tripId: trip.id, legIndex: i, role: role, demo: trip.demo, tagLabel: trip.tagLabel }));
      });
    });
    return out;
  }

  /* ---------------- state ---------------- */
  var todayDate = new Date();
  var state = {
    view: "calendar",
    visibleYm: todayDate.getFullYear()+"-"+pad2(todayDate.getMonth()+1),
    editingTripId: null,
    monthsLoaded: [] // array of {y,m} in order, ascending
  };
  var MONTHS_BACK_INIT = 3, MONTHS_FWD_INIT = 8, MONTHS_STEP = 3, MONTHS_MAX = 40;

  function monthKey(y,m){ return y+"-"+pad2(m+1); }

  /* The year used to repeat inside every month header ("2026年9月", "2026年10月", ...)
     as you scrolled — now each month header is just its month name, and the year
     lives once, beside the "今天" button, updating to match whichever month is
     currently scrolled into view. */
  function updateYearLabel(){
    var el = document.getElementById("yearLabel");

    el.textContent = (state.visibleYm || "").split("-")[0] + "年";
  }
  /* ---------------- ledger (accounting area, 4 editable tiles) ---------------- */
  function tileCount(){ return settings.tileCount === 2 ? 2 : 4; }
  function effectiveTileLayout(){
    var layout = (settings.tileLayout && settings.tileLayout.length === 4) ? settings.tileLayout : DEFAULT_TILE_LAYOUT;
    return layout.map(function(id){
      var meta = METRIC_META[id];
      if(!meta || (meta.needsReimb && !settings.showReimbursement)) return "trip_count";
      return id;
    });
  }
  function renderLedger(list){
    updateYearLabel();
    var legs = flatLegs(list);
    var monthLegs = legs.filter(function(l){ return (l.date||"").slice(0,7) === state.visibleYm; });
    var count = tileCount();
    var layout = effectiveTileLayout().slice(0, count);
    var html = "";
    document.getElementById("ledger").classList.toggle("ledger-2", count === 2);
    layout.forEach(function(id){
      var meta = METRIC_META[id] || METRIC_META.trip_count;
      var val = computeMetric(id, monthLegs);
      var display = meta.unit === "money" ? fmtMoney(val) : (val + " 筆");
      html += '<div class="ledger-tile"><div class="k">'+meta.label+'</div><div class="v '+meta.unit+'">'+display+'</div></div>';
    });
    document.getElementById("ledger").innerHTML = html;
  }

  /* ---------------- continuous calendar ---------------- */

    return wrap;
  }

  function fillMonthGrid(block, y, m, legsByDate, todayS){
    var grid = block.querySelector(".cal-grid");
    var firstOfMonth = new Date(y, m, 1);
    var startOffset = firstOfMonth.getDay();
    var gridStart = new Date(y, m, 1 - startOffset);
    var daysInMonth = new Date(y, m+1, 0).getDate();
    var totalCells = Math.ceil((startOffset + daysInMonth) / 7) * 7;
    var html = "";
    for(var i=0;i<totalCells;i++){
      var cellDate = new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate()+i);
      var ds = ymd(cellDate.getFullYear(), cellDate.getMonth(), cellDate.getDate());
      var outMonth = cellDate.getMonth() !== m;
      if(outMonth){
        html += '<div class="cal-cell out-month"></div>';
        continue;
      }
      var isToday = ds === todayS;
      var dow = cellDate.getDay();
      var hName = holidayName(ds);
      var isDayOff = dow === 0 || dow === 6 || !!hName;
      var dayLegs = (legsByDate[ds] || []).filter(function(l){ return l.status !== "cancelled"; });
      html += '<div class="cal-cell'+(isToday?' is-today':'')+(isDayOff?' is-dayoff':'')+'"'+(hName?' title="'+escapeHtml(hName)+'"':'')+' data-date="'+ds+'">';
      html += '<div class="cell-top"><div class="daynum">'+cellDate.getDate()+'</div>'+
              '</div>';
      var MAX_STICKERS = 6;
      dayLegs.slice(0, MAX_STICKERS).forEach(function(l, idx){
        var dstatus = displayStatus(l);
        var routeText = shortCity(l.from)+"→"+shortCity(l.to);
        var tr = legTimeRange(l);
        var tip = routeText+" "+tr.start+"–"+tr.end;
        var pos = stickerPosFor(l, idx);
        var rot = [-8,7,-3,6,-5,4][idx % 6];
        html += '<span class="badge role-'+l.role+' st-'+dstatus+(l.demo?' demo':'')+'" data-trip-id="'+l.tripId+'" data-leg-index="'+l.legIndex+'" data-demo="'+(l.demo?"1":"0")+'" data-rot="'+rot+'" draggable="false"'+
                  ' style="left:'+(pos.x*100).toFixed(1)+'%;top:'+(pos.y*100).toFixed(1)+'%;--rot:'+rot+'deg" title="'+escapeHtml(tip)+'">'+escapeHtml(legTag(l))+'</span>';
      });
      if(dayLegs.length > MAX_STICKERS){
        html += '<span class="more-hint" style="left:88%;top:18%">+'+(dayLegs.length-MAX_STICKERS)+'</span>';
      }
      html += '</div>';
    }
    grid.innerHTML = html;
    grid.querySelectorAll(".badge").forEach(function(el){ wireBadgeDrag(el); });
    grid.querySelectorAll(".cal-cell[data-date]").forEach(function(el){
      el.addEventListener("click", function(){ openModal(null, el.getAttribute("data-date")); });
    });
  }

  /* ---------------- month-wide sticker "labels" (whole-month decorative stickers) ----------------
     Unlike a trip's small icon badge (pinned inside one day cell), a label sticker floats freely
     over the WHOLE month grid. It has two nested states:
       - .active  — entered by a long-press (same 600ms gesture as dragging a trip badge) on the
                    sticker's body; reveals a dashed selection ring plus four small round buttons:
                    ✓ done, ✎ edit content/shape/colour, ⤢ toggle resize/rotate, × delete. The same
                    long-press also drags it live while held.
       - .resizing — a sub-state of .active, toggled by the ⤢ button, that additionally reveals the
                    resize (corner) and rotate (top) handles.
     Every gesture (move / resize / rotate) only touches the DOM live while held; the change is
     persisted (labelPatch, which triggers a full re-render) once released. ✓ or tapping elsewhere
     just closes the active/resizing UI — nothing new to save at that point. */
  var selectedLabelId = null;
  var resizeModeLabelId = null;
  var STK_LONG_PRESS_MS = 600;
  var STK_SNAP_DEG = 6; // rotate handle clicks to upright within ± this many degrees
  var STK_MOVE_CANCEL_PX = 6;
  /* One SVG shape per sticker type, drawn with a stroke (not a CSS clip-path),
     so the border comes out a clean, uniform width around the *actual* shape —
     including the spiky star and the notched ribbon — no matter how the
     sticker gets stretched. preserveAspectRatio="none" lets the shape follow
     an arbitrary width/height; vector-effect keeps the stroke itself from
     getting thicker/thinner on either axis when that stretch happens. */
  var STK_SHAPE_SVG = {
    highlight: '<rect x="2" y="2" width="96" height="96" class="stk-shape-el"/>',
    oval: '<ellipse cx="50" cy="50" rx="48" ry="48" class="stk-shape-el"/>',
    ribbon: '<polygon points="0,50 15,2 98,2 85,50 98,98 15,98" class="stk-shape-el"/>',
    burst: '<polygon points="50,2 58,15 73,4 75,21 91,15 87,32 100,35 89,48 100,65 86,65 91,82 75,75 73,92 58,81 50,100 42,81 27,92 25,75 9,82 14,65 0,65 11,48 0,35 13,32 9,15 25,21 27,4 42,15" class="stk-shape-el"/>'
  };
  function stkSvgFor(shape){
    return '<svg class="stk-svg" viewBox="0 0 100 100" preserveAspectRatio="none">'+(STK_SHAPE_SVG[shape]||STK_SHAPE_SVG.highlight)+'</svg>';
  }

  function fillMonthStickers(block, ym){
    var layer = block.querySelector(".month-sticker-layer");
    var monthLabels = labels.filter(function(l){ return l.ym === ym; });
    layer.innerHTML = monthLabels.map(function(l){
      var shape = l.shape || "highlight";
      var isActive = l.id === selectedLabelId;
      var isResizing = isActive && l.id === resizeModeLabelId;
      var colorStyle = "";
      var alpha = (l.alpha === null || l.alpha === undefined || isNaN(Number(l.alpha))) ? null : Math.max(0.1, Math.min(1, Number(l.alpha)));
      if(l.color){
        var dark = isDarkThemeActive();
        var border = dark ? mixHex(l.color, "#ffffff", 0.15) : l.color;
        var fill = dark ? mixHex(border, "#000000", 0.78) : mixHex(l.color, "#ffffff", 0.85);
        // translucent (highlighter) mode uses the full-strength colour, so the
        // see-through result is vivid rather than a washed-out pastel
        if(alpha !== null) fill = border;
        colorStyle = "--stk-border:"+border+";--stk-fill:"+fill+";";
      }else if(alpha !== null){
        colorStyle = "--stk-fill:var(--accent);";
      }
      if(alpha !== null) colorStyle += "--stk-op:"+alpha+";";
      if(l.textColor) colorStyle += "--stk-text:"+l.textColor+";";
      if(l.textAlpha !== null && l.textAlpha !== undefined && !isNaN(Number(l.textAlpha))){
        colorStyle += "--stk-text-op:"+Math.max(0.1, Math.min(1, Number(l.textAlpha)))+";";
      }
      return '<div class="stk shape-'+shape+(isActive?' active':'')+(isResizing?' resizing':'')+'" data-label-id="'+l.id+'" '+
        'style="left:'+l.x+'%;top:'+l.y+'%;width:'+l.w+'%;height:'+l.h+'%;--rot:'+(l.rot||0)+'deg;'+colorStyle+'">'+
        stkSvgFor(shape)+
        '<div class="stk-text">'+escapeHtml(l.text||"")+'</div>'+
        '<div class="stk-toolbar">'+
          '<button type="button" class="stk-tb-btn stk-confirm" title="完成">✓</button>'+
          '<button type="button" class="stk-tb-btn stk-edit" title="編輯內容">✎</button>'+
          '<button type="button" class="stk-tb-btn stk-resizetoggle" title="調整大小／旋轉">⤢</button>'+
          '<button type="button" class="stk-tb-btn stk-del" title="刪除">×</button>'+
        '</div>'+
        '<div class="stk-handle stk-rotate"></div>'+
        '<div class="stk-handle stk-resize"></div>'+
      '</div>';
    }).join("");
    layer.querySelectorAll(".stk").forEach(function(el){ wireStickerLabel(el); });
  }

  function deactivateSticker(){
    if(selectedLabelId === null) return;
    var prevId = selectedLabelId;
    selectedLabelId = null;
    resizeModeLabelId = null;
    var el = document.querySelector('.stk[data-label-id="'+prevId+'"]');
    if(el) el.classList.remove("active", "resizing");
  }
  document.addEventListener("click", function(ev){
    if(ev.target.closest(".stk")) return;
    if(ev.target.closest("#labelEditOverlay")) return; // editing the active sticker shouldn't close it
    if(ev.target.closest("#fabTagBtn")) return; // creating a new sticker activates it itself
    deactivateSticker();
  });

  function wireStickerLabel(el){
    var id = el.getAttribute("data-label-id");
    var layer = el.closest(".month-sticker-layer");

    function activateThis(){
      if(selectedLabelId === id){ el.classList.add("active"); return; }
      if(selectedLabelId) deactivateSticker();
      selectedLabelId = id;
      el.classList.add("active");
    }

    /* body long-press (600ms, same feel as dragging a trip badge) both activates the
       sticker (reveals its buttons) and, if the finger/mouse keeps moving, drags it. */
    var pressTimer = null, dragging = false, moved = false, startX=0, startY=0;
    function layerRect(){ return layer.getBoundingClientRect(); }
    function cancelTimer(){ if(pressTimer){ clearTimeout(pressTimer); pressTimer = null; } }
    function applyMove(clientX, clientY){
      var r = layerRect();
      var x = clampPct((clientX - r.left) / r.width) * 100;
      var y = clampPct((clientY - r.top) / r.height) * 100;
      el.style.left = x.toFixed(1)+"%";
      el.style.top = y.toFixed(1)+"%";
      return { x:x, y:y };
    }
    var pressActive = false;
    function beginPress(clientX, clientY){
      gateOn();
      pressActive = true;
      startX = clientX; startY = clientY; moved = false;
      cancelTimer();
      pressTimer = setTimeout(function(){
        dragging = true;
        el.classList.add("dragging");
        activateThis();
      }, STK_LONG_PRESS_MS);
    }
    function moveTo(clientX, clientY){
      if(!dragging){
        if(Math.abs(clientX-startX) > STK_MOVE_CANCEL_PX || Math.abs(clientY-startY) > STK_MOVE_CANCEL_PX){
          cancelTimer();
          // a sticker that is already selected (e.g. the one just created) is
          // already "picked up": dragging it needs no 600ms long-press first
          if(selectedLabelId === id && pressActive){
            dragging = true;
            el.classList.add("dragging");
            activateThis();
          } else { return; }
        } else { return; }
      }
      moved = true;
      applyMove(clientX, clientY);
    }
    function finishPress(clientX, clientY){
      pressActive = false;
      cancelTimer();
      if(dragging){
        dragging = false;
        el.classList.remove("dragging");
        if(moved){
          var p = applyMove(clientX, clientY);
          labelPatch(id, { x: Number(p.x.toFixed(1)), y: Number(p.y.toFixed(1)) });
        }
      }
      gateOff();
    }
    function abortPress(){ pressActive = false; cancelTimer(); if(dragging){ dragging = false; el.classList.remove("dragging"); } gateOff(); }

    el.addEventListener("mousedown", function(ev){
      if(ev.target.closest(".stk-handle,.stk-btn")) return;
      ev.preventDefault(); ev.stopPropagation();
      beginPress(ev.clientX, ev.clientY);
      function onMove(e){ moveTo(e.clientX, e.clientY); }
      function onUp(e){
        document.removeEventListener("mousemove", onMove);
        document.removeEventListener("mouseup", onUp);
        finishPress(e.clientX, e.clientY);
      }
      document.addEventListener("mousemove", onMove);
      document.addEventListener("mouseup", onUp);
    });
    el.addEventListener("touchstart", function(ev){
      if(ev.target.closest(".stk-handle,.stk-btn")) return;
      ev.stopPropagation();
      var t = ev.touches[0];
      beginPress(t.clientX, t.clientY);
    }, { passive:true });
    el.addEventListener("touchmove", function(ev){
      if(dragging) ev.preventDefault();
      var t = ev.touches[0];
      moveTo(t.clientX, t.clientY);
    }, { passive:false });
    el.addEventListener("touchend", function(ev){
      var t = ev.changedTouches[0];
      finishPress(t.clientX, t.clientY);
    });
    el.addEventListener("touchcancel", abortPress);

    /* resize handle (bottom-right, grows/shrinks symmetrically from the centre —
       since the sticker is centred on its x/y point, moving the visible corner by
       dpx means the box's total width/height must grow by 2×dpx). Only reachable
       once the ⤢ button has switched the sticker into .resizing. */
    var resizeHandle = el.querySelector(".stk-resize");
    var startW=0, startH=0, resizing=false;
    function beginResize(clientX, clientY){
      resizing = true; startX = clientX; startY = clientY;
      startW = parseFloat(el.style.width); startH = parseFloat(el.style.height);
    }
    function moveResize(clientX, clientY){
      if(!resizing) return;
      var r = layerRect();
      var dw = ((clientX-startX)/r.width)*100*2;
      var dh = ((clientY-startY)/r.height)*100*2;
      var w = Math.max(8, startW+dw), h = Math.max(6, startH+dh);
      el.style.width = w.toFixed(1)+"%";
      el.style.height = h.toFixed(1)+"%";
    }
    function endResize(){
      if(!resizing) return;
      resizing = false;
      labelPatch(id, { w: Number(parseFloat(el.style.width).toFixed(1)), h: Number(parseFloat(el.style.height).toFixed(1)) });
    }
    resizeHandle.addEventListener("mousedown", function(ev){
      ev.preventDefault(); ev.stopPropagation();
      beginResize(ev.clientX, ev.clientY);
      function onMove(e){ moveResize(e.clientX, e.clientY); }
      function onUp(){
        document.removeEventListener("mousemove", onMove);
        document.removeEventListener("mouseup", onUp);
        endResize();
      }
      document.addEventListener("mousemove", onMove);
      document.addEventListener("mouseup", onUp);
    });
    resizeHandle.addEventListener("touchstart", function(ev){
      ev.stopPropagation();
      var t = ev.touches[0];
      beginResize(t.clientX, t.clientY);
    }, { passive:true });
    resizeHandle.addEventListener("touchmove", function(ev){
      if(!resizing) return;
      ev.preventDefault();
      var t = ev.touches[0];
      moveResize(t.clientX, t.clientY);
    }, { passive:false });
    resizeHandle.addEventListener("touchend", function(ev){ endResize(); });

    /* rotate handle: rotation = angle from the sticker's own centre to the pointer */
    var rotateHandle = el.querySelector(".stk-rotate");
    var rotating = false;
    function angleFor(clientX, clientY){
      var r = el.getBoundingClientRect();
      var cx = r.left + r.width/2, cy = r.top + r.height/2;
      var deg = Math.atan2(clientY-cy, clientX-cx) * 180/Math.PI + 90;
      deg = ((deg + 180) % 360 + 360) % 360 - 180; // normalise to -180..180
      // magnetic detent at upright: close enough to 0° snaps to exactly 0°,
      // so a sticker nudged crooked by accident is easy to set straight again
      if(Math.abs(deg) <= STK_SNAP_DEG) return 0;
      return Math.round(deg);
    }
    var wasSnapped = false;
    function beginRotate(){ rotating = true; wasSnapped = false; }
    function moveRotate(clientX, clientY){
      if(!rotating) return;
      var a = angleFor(clientX, clientY);
      el.style.setProperty("--rot", a+"deg");
      var snapped = (a === 0);
      if(snapped && !wasSnapped && navigator.vibrate){ try{ navigator.vibrate(8); }catch(e){} }
      wasSnapped = snapped;
    }
    function endRotate(clientX, clientY){
      if(!rotating) return;
      rotating = false;
      labelPatch(id, { rot: angleFor(clientX, clientY) });
    }
    rotateHandle.addEventListener("mousedown", function(ev){
      ev.preventDefault(); ev.stopPropagation();
      beginRotate();
      function onMove(e){ moveRotate(e.clientX, e.clientY); }
      function onUp(e){
        document.removeEventListener("mousemove", onMove);
        document.removeEventListener("mouseup", onUp);
        endRotate(e.clientX, e.clientY);
      }
      document.addEventListener("mousemove", onMove);
      document.addEventListener("mouseup", onUp);
    });
    rotateHandle.addEventListener("touchstart", function(ev){
      ev.stopPropagation();
      beginRotate();
    }, { passive:true });
    rotateHandle.addEventListener("touchmove", function(ev){
      if(!rotating) return;
      ev.preventDefault();
      var t = ev.touches[0];
      moveRotate(t.clientX, t.clientY);
    }, { passive:false });
    rotateHandle.addEventListener("touchend", function(ev){
      var t = ev.changedTouches[0];
      endRotate(t.clientX, t.clientY);
    });

    el.querySelector(".stk-confirm").addEventListener("click", function(ev){
      ev.stopPropagation();
      deactivateSticker();
    });
    el.querySelector(".stk-resizetoggle").addEventListener("click", function(ev){
      ev.stopPropagation();
      if(resizeModeLabelId === id){ resizeModeLabelId = null; el.classList.remove("resizing"); }
      else { resizeModeLabelId = id; el.classList.add("resizing"); }
    });
    el.querySelector(".stk-del").addEventListener("click", function(ev){
      ev.stopPropagation();
      labelDelete(id);
    });
    el.querySelector(".stk-edit").addEventListener("click", function(ev){
      ev.stopPropagation();
      openLabelEdit(id);
    });
    el.addEventListener("click", function(ev){ ev.stopPropagation(); });
  }

  /* long-press a calendar sticker to drag it anywhere within its day cell
     (its center stays inside the cell; the visible circle can bleed slightly
     over the edge, like a real sticker). A quick tap still opens the trip. */
  var STICKER_LONG_PRESS_MS = 600;
  var STICKER_MOVE_CANCEL_PX = 6;
  /* Plain mouse + touch events, not Pointer Events — some in-app WebViews
     (the various hosts an Artifact can run inside) handle pointer capture
     inconsistently, and this drag needs to work everywhere reliably. */
  function wireBadgeDrag(el){
    var cell = el.closest(".cal-cell");
    var pressTimer = null, dragging = false, moved = false, startX = 0, startY = 0;

    function cancelTimer(){ if(pressTimer){ clearTimeout(pressTimer); pressTimer = null; } }
    function posFor(clientX, clientY){
      var rect = cell.getBoundingClientRect();
      return { x: clampPct((clientX - rect.left) / rect.width), y: clampPct((clientY - rect.top) / rect.height) };
    }
    function applyPos(p){ el.style.left = (p.x*100).toFixed(1)+"%"; el.style.top = (p.y*100).toFixed(1)+"%"; }
    function beginPress(clientX, clientY){
      gateOn();
      startX = clientX; startY = clientY; moved = false;
      cancelTimer();
      pressTimer = setTimeout(function(){
        dragging = true;
        cell.classList.add("sticker-editing");
        el.classList.add("badge-dragging");
      }, STICKER_LONG_PRESS_MS);
    }
    function moveTo(clientX, clientY){
      var dx = clientX - startX, dy = clientY - startY;
      if(!dragging && Math.sqrt(dx*dx + dy*dy) > STICKER_MOVE_CANCEL_PX){
        moved = true;
        cancelTimer();
      }
      if(dragging){ applyPos(posFor(clientX, clientY)); }
    }
    function finishPress(clientX, clientY){
      cancelTimer();
      if(dragging){
        var p = posFor(clientX, clientY);
        applyPos(p);
        dragging = false;
        cell.classList.remove("sticker-editing");
        el.classList.remove("badge-dragging");
        setLegStickerPos(el.getAttribute("data-trip-id"), Number(el.getAttribute("data-leg-index")), p.x, p.y);
      } else if(!moved){
        gateOff();
        openModal(el.getAttribute("data-trip-id"));
      }
      gateOff();
    }
    function abortPress(){
      gateOff();
      cancelTimer();
      if(dragging){
        dragging = false;
        cell.classList.remove("sticker-editing");
        el.classList.remove("badge-dragging");
      }
    }

    el.setAttribute("draggable", "false");
    el.addEventListener("dragstart", function(ev){ ev.preventDefault(); });
    el.addEventListener("contextmenu", function(ev){ ev.preventDefault(); });

    el.addEventListener("mousedown", function(ev){
      if(ev.button !== 0) return;
      ev.preventDefault();
      beginPress(ev.clientX, ev.clientY);
      function onMove(e){ moveTo(e.clientX, e.clientY); }
      function onUp(e){
        document.removeEventListener("mousemove", onMove);
        document.removeEventListener("mouseup", onUp);
        finishPress(e.clientX, e.clientY);
      }
      document.addEventListener("mousemove", onMove);
      document.addEventListener("mouseup", onUp);
    });

    el.addEventListener("touchstart", function(ev){
      var t = ev.touches[0];
      beginPress(t.clientX, t.clientY);
    }, { passive:true });
    el.addEventListener("touchmove", function(ev){
      var t = ev.touches[0];
      if(dragging) ev.preventDefault();
      moveTo(t.clientX, t.clientY);
    }, { passive:false });
    el.addEventListener("touchend", function(ev){
      var t = ev.changedTouches[0];
      finishPress(t.clientX, t.clientY);
    });
    el.addEventListener("touchcancel", abortPress);

    el.addEventListener("click", function(ev){ ev.stopPropagation(); });
  }

  function legsByDateFrom(effectiveList){
    var legs = flatLegs(effectiveList);
    var map = {};
    legs.forEach(function(l){ if(!map[l.date]) map[l.date]=[]; map[l.date].push(l); });
    return map;
  }

  var lastEffectiveList = [];

  function renderCalendarMonths(){
    var monthsEl = document.getElementById("calMonths");
    var topSentinel = document.getElementById("topSentinel");
    var bottomSentinel = document.getElementById("bottomSentinel");
    // remove old blocks
    monthsEl.querySelectorAll(".month-block").forEach(function(b){ b.remove(); });

    var byDate = legsByDateFrom(lastEffectiveList);
    var todayS = todayStr();
    var frag = document.createDocumentFragment();
    state.monthsLoaded.forEach(function(ym){
      var block = buildMonthBlock(ym.y, ym.m);
      fillMonthGrid(block, ym.y, ym.m, byDate, todayS);
      fillMonthStickers(block, monthKey(ym.y, ym.m));
      frag.appendChild(block);
    });
    monthsEl.insertBefore(frag, bottomSentinel);
    setupObservers();
  }

  function setupObservers(){
    if(monthObserver) monthObserver.disconnect();
    if(edgeObserver) edgeObserver.disconnect();
    var scrollAreaEl = document.getElementById("scrollArea");

    monthObserver = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if(entry.isIntersecting){
          var ym = entry.target.getAttribute("data-ym");
          if(ym){ state.visibleYm = ym; renderLedger(lastEffectiveList); }
        }
      });
    }, { root:scrollAreaEl, rootMargin:"-46px 0px -70% 0px", threshold:0 });
    document.querySelectorAll(".month-block").forEach(function(b){ monthObserver.observe(b); });

    edgeObserver = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if(!entry.isIntersecting) return;
        if(entry.target.id === "bottomSentinel"){ extendMonths("forward"); }
        if(entry.target.id === "topSentinel"){ extendMonths("backward"); }
      });
    }, { root:scrollAreaEl, rootMargin:"400px 0px 400px 0px", threshold:0 });
    edgeObserver.observe(document.getElementById("topSentinel"));
    edgeObserver.observe(document.getElementById("bottomSentinel"));
  }

  function labelForYm(ym){
    var parts = ym.split("-");
    return parts[0] + "年" + MONTH_NAMES[Number(parts[1])-1];
  }

  function extendMonths(direction){
    if(state.monthsLoaded.length >= MONTHS_MAX) return;
    var monthsEl = document.getElementById("calMonths");
    var byDate = legsByDateFrom(lastEffectiveList);
    var todayS = todayStr();

    if(direction === "forward"){
      var last = state.monthsLoaded[state.monthsLoaded.length-1];
      var frag = document.createDocumentFragment();
      var y = last.y, m = last.m;
      for(var i=0;i<MONTHS_STEP;i++){
        m++; if(m>11){ m=0; y++; }
        state.monthsLoaded.push({y:y,m:m});
        var block = buildMonthBlock(y,m);
        fillMonthGrid(block, y, m, byDate, todayS);
        fillMonthStickers(block, monthKey(y, m));
        frag.appendChild(block);
      }
      document.getElementById("bottomSentinel").before(frag);
      document.querySelectorAll(".month-block").forEach(function(b){ monthObserver.observe(b); });
    } else {
      var first = state.monthsLoaded[0];
      var scrollAreaEl = document.getElementById("scrollArea");
      var prevScrollHeight = scrollAreaEl.scrollHeight;
      var prevScrollTop = scrollAreaEl.scrollTop;
      var newMonths = [];
      var y2 = first.y, m2 = first.m;
      for(var j=0;j<MONTHS_STEP;j++){
        m2--; if(m2<0){ m2=11; y2--; }
        newMonths.unshift({y:y2,m:m2});
      }
      state.monthsLoaded = newMonths.concat(state.monthsLoaded);
      var topSentinel = document.getElementById("topSentinel");
      var frag2 = document.createDocumentFragment();
      newMonths.forEach(function(ym){
        var block = buildMonthBlock(ym.y, ym.m);
        fillMonthGrid(block, ym.y, ym.m, byDate, todayS);
        fillMonthStickers(block, monthKey(ym.y, ym.m));
        frag2.appendChild(block);
      });
      topSentinel.after(frag2);
      document.querySelectorAll(".month-block").forEach(function(b){ monthObserver.observe(b); });
      requestAnimationFrame(function(){
        var newScrollHeight = scrollAreaEl.scrollHeight;
        scrollAreaEl.scrollTop = prevScrollTop + (newScrollHeight - prevScrollHeight);
      });
    }
  }

  function scrollToYm(ym, smooth){
    var block = document.querySelector('.month-block[data-ym="'+ym+'"]');
    if(block){
      // scrollIntoView's block:"start" lines the month block's top edge up
      // with the scroll container's own top edge — but the weekday-name row
      // (日一二三四五六) is position:sticky at top:0 inside that same
      // container, so it would then sit pinned directly over the month
      // label/first row. Scroll manually instead, leaving room for that
      // sticky row's own height so the month starts right below it.
      var scrollAreaEl = document.getElementById("scrollArea");
      var weekdaysEl = document.querySelector(".cal-weekdays");
      var headerOffset = weekdaysEl ? weekdaysEl.getBoundingClientRect().height : 0;
      var areaRect = scrollAreaEl.getBoundingClientRect();
      var blockRect = block.getBoundingClientRect();
      var delta = blockRect.top - areaRect.top - headerOffset;
      var target = scrollAreaEl.scrollTop + delta;
      if(smooth){ scrollAreaEl.scrollTo({ top: target, behavior:"smooth" }); }
      else{ scrollAreaEl.scrollTop = target; }
      return true;
    }
    return false;
  }

  function initMonthRange(){

    var y = n.getFullYear(), m = n.getMonth() - MONTHS_BACK_INIT;
    while(m<0){ m+=12; y--; }
    for(var i=0;i<MONTHS_BACK_INIT+MONTHS_FWD_INIT+1;i++){
      months.push({y:y,m:m});
      m++; if(m>11){ m=0; y++; }
    }
    state.monthsLoaded = months;

  function listCutoffDate(){
    var n = new Date();

      sa.scrollTo({ top: Math.max(0, top), left: 0, behavior: smooth ? "smooth" : "auto" });

            (settings.showMoney ? '<span class="tk-price mono">'+fmtMoney(total)+'</span>' : '')+

            (sLabel ? (

                    Object.keys(SETTLE_META).map(function(k){ return '<option value="'+k+'"'+((l.settleStatus||"unsettled")===k?' selected':'')+'>'+SETTLE_META[k].label+'</option>'; }).join('')+

        html += '<div class="ticket-pair">'+cardHtml(l,"pair-a")+cardHtml(ret,"pair-b")+'</div>';

    el.innerHTML = html;

      var lpTimer = null, sx = 0, sy = 0;

      card.addEventListener("pointerdown", function(ev){

      });
      ["pointerup","pointercancel","pointerleave"].forEach(function(t){ card.addEventListener(t, cancelLp); });
      card.addEventListener("contextmenu", function(ev){ ev.preventDefault(); });

    el.querySelectorAll(".settle-select").forEach(function(sel){
