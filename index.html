      sel.addEventListener("change", function(){

        this.className = "settle-select " + settleClass({ settleStatus: this.value });

  /* ---------------- swipe left/right between 月曆 and 清單 ---------------- */
  (function(){
    var scrollArea = document.getElementById("scrollArea");
    var startX = 0, startY = 0, tracking = false, axis = null;
    var SWIPE_MIN = 55;
    scrollArea.addEventListener("touchstart", function(ev){
      if(ev.touches.length !== 1) return;
      var t = ev.touches[0];
      startX = t.clientX; startY = t.clientY;
      tracking = true; axis = null;
    }, { passive:true });
    scrollArea.addEventListener("touchmove", function(ev){
      if(!tracking) return;
      var t = ev.touches[0];
      var dx = t.clientX - startX, dy = t.clientY - startY;
      if(axis === null && (Math.abs(dx) > 8 || Math.abs(dy) > 8)){
        axis = Math.abs(dx) > Math.abs(dy) ? "h" : "v";
      }
      if(axis === "h" && ev.cancelable) ev.preventDefault();
    }, { passive:false });
    scrollArea.addEventListener("touchend", function(ev){
      if(!tracking) return;
      tracking = false;
      if(axis !== "h") return;
      var t = ev.changedTouches[0];
      var dx = t.clientX - startX;
      if(Math.abs(dx) < SWIPE_MIN) return;
      if(dx < 0){ switchToListView(); }
      else{ switchToCalendarView(); }
    });
    scrollArea.addEventListener("touchcancel", function(){ tracking = false; axis = null; });
  })();

  /* swipe the panel area sideways to step to the neighbouring tab; at the
     first/last tab there is simply nothing further, so nothing happens. */
  (function(){
    var body = document.querySelector("#settingsOverlay .modal-body");
    var sx = 0, sy = 0, tracking = false;
    body.addEventListener("touchstart", function(ev){
      if(ev.touches.length !== 1){ tracking = false; return; }
      sx = ev.touches[0].clientX; sy = ev.touches[0].clientY; tracking = true;
    }, { passive:true });
    body.addEventListener("touchend", function(ev){
      if(!tracking) return;
      tracking = false;
      var t = ev.changedTouches[0];
      var dx = t.clientX - sx, dy = t.clientY - sy;
      if(Math.abs(dx) < 50 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
      var i = SET_TABS.indexOf(curSetTab) + (dx < 0 ? 1 : -1);
      if(i < 0 || i >= SET_TABS.length) return;
      switchSetTab(SET_TABS[i], false);
    }, { passive:true });
    body.addEventListener("touchcancel", function(){ tracking = false; }, { passive:true });
  })();

  function readLegFromBlock(block){
    var mode = block.querySelector(".f-mode").value;
    var fareType = block.querySelector(".f-fareType").value;
    var seg0 = {
      isMain: true,
      mode: mode, no: block.querySelector(".f-no").value.trim(),
      depart: block.querySelector(".f-depart").value, arrive: block.querySelector(".f-arrive").value,
      fareType: fareType,
      price: Number(block.querySelector(".f-price").value) || 0
    };
    var segments = [seg0];
    if(block.querySelector(".f-hasTransfer").checked){
      var tseg = {
        mode: block.querySelector(".f-tmode").value, no: block.querySelector(".f-tno").value.trim(),
        depart: block.querySelector(".f-tdepart").value, arrive: block.querySelector(".f-tarrive").value,
        fareType:"full", price: Number(block.querySelector(".f-tprice").value) || 0
      };
      var posBtn = block.querySelector(".f-tpos button.active");
      if(posBtn && posBtn.getAttribute("data-v") === "before") segments.unshift(tseg);
      else segments.push(tseg);
    }
    var statusBtn = block.querySelector(".f-status button.active");
    var status = statusBtn ? statusBtn.getAttribute("data-v") : "unpaid";
    var settleBtn = block.querySelector(".f-settle button.active");
    var settleStatus = settleBtn ? settleBtn.getAttribute("data-v") : "unsettled";
    return {
      date: block.querySelector(".f-date").value,
      from: block.querySelector(".f-from").value.trim(),
      to: block.querySelector(".f-to").value.trim(),
      segments: segments,
      status: status,
      settleStatus: settleStatus,
      notes: block.getAttribute("data-notes") || ""
    };
  }

  function wireLegForms(){
    document.querySelectorAll(".leg-block").forEach(function(block){
      var idx = Number(block.getAttribute("data-leg-index"));

      block.querySelector(".leg-head").addEventListener("click", function(){
        if(block.classList.contains("single")) return;
        block.classList.toggle("open");
      });
      var nextBtn = block.querySelector('[data-action="next-leg"]');
      if(nextBtn){ nextBtn.addEventListener("click", function(){
        updateLegSummary(block);
        // a still-empty return leg starts as the outbound trip reversed
        var nb = document.querySelector('.leg-block[data-leg-index="'+(idx+1)+'"]');
        if(nb){
          var nf = nb.querySelector(".f-from"), nt = nb.querySelector(".f-to");
          if(!nf.value.trim() && !nt.value.trim()){
            nf.value = block.querySelector(".f-to").value; nt.value = block.querySelector(".f-from").value;
            updateLegSummary(nb);
          }
        }
        block.classList.remove("open");
        openLeg(idx+1);
        setTimeout(function(){ scrollLegToTop(idx+1); }, 360); // after the fold-up has finished moving things
      }); }
      block.addEventListener("input", function(ev){
        updateLegSummary(block);
        var t = ev.target;
        if(t && (t.classList.contains("f-from") || t.classList.contains("f-to"))){
          if(idx === 0) syncReturnFromOutbound();
          else block.removeAttribute("data-auto"); // the user is writing this leg themselves now
        }
      });
      block.addEventListener("change", function(){ updateLegSummary(block); });

      block.querySelector(".f-hasTransfer").addEventListener("change", function(){
        block.querySelector(".transfer-block").classList.toggle("show", this.checked);
        recalcLegTotal(block); updateLegSummary(block);
      });
      block.querySelector(".f-tpos").addEventListener("click", function(ev){
        var btn = ev.target.closest("button");
        if(!btn) return;
        this.querySelectorAll("button").forEach(function(b){ b.classList.remove("active"); });
        btn.classList.add("active");
      });
      block.querySelectorAll(".f-price, .f-tprice").forEach(function(inp){
        inp.addEventListener("input", function(){ recalcLegTotal(block); });
      });
      function flashSwapBtn(btn){
        btn.classList.add("flash");
        setTimeout(function(){ btn.classList.remove("flash"); }, 260);
      }
      var swapFT = block.querySelector('[data-action="swap-from-to"]');
      if(swapFT){
        swapFT.addEventListener("click", function(){
          var fromInp = block.querySelector(".f-from"), toInp = block.querySelector(".f-to");
          var tmp = fromInp.value; fromInp.value = toInp.value; toInp.value = tmp;
          flashSwapBtn(swapFT); updateLegSummary(block);
          if(idx > 0) block.removeAttribute("data-auto");
          else syncReturnFromOutbound();
        });
      }
      var swapOut = block.querySelector('[data-action="swap-from-outbound"]');
      if(swapOut){
        swapOut.addEventListener("click", function(){
          var outBlock = document.querySelector('.leg-block[data-leg-index="0"]');
          if(!outBlock) return;
          block.querySelector(".f-from").value = outBlock.querySelector(".f-to").value;
          block.querySelector(".f-to").value = outBlock.querySelector(".f-from").value;
          flashSwapBtn(swapOut); updateLegSummary(block);
        });
      }
      block.querySelector(".f-status").addEventListener("click", function(ev){
        var btn = ev.target.closest("button");
        if(!btn) return;
        this.querySelectorAll("button").forEach(function(b){ b.classList.remove("active"); });
        btn.classList.add("active");
      });
      var settle = block.querySelector(".f-settle");
      if(settle){
        settle.addEventListener("click", function(ev){
          var btn = ev.target.closest("button");
          if(!btn) return;
          this.querySelectorAll("button").forEach(function(b){ b.classList.remove("active"); });
          btn.classList.add("active");
        });
      }
    });
  }

  function recalcLegTotal(){
    var sum = 0;
    document.querySelectorAll(".leg-block").forEach(function(block){
      sum += Number(block.querySelector(".f-price").value) || 0;
      if(block.querySelector(".f-hasTransfer").checked) sum += Number(block.querySelector(".f-tprice").value) || 0;
    });
    var el = document.getElementById("tripTotalVal");
    if(el) el.textContent = fmtMoney(sum);
  }

  function openModal(tripId, prefillDate){
    var deleteBtn = document.getElementById("deleteBtn");
    if(tripId){
      var trip = trips.find(function(x){ return x.id === tripId; });
      var isRealTrip = !!trip;
      if(!trip){ trip = lastEffectiveList.find(function(x){ return x.id === tripId; }); }
      if(!trip) return;
      state.editingTripId = isRealTrip ? tripId : null;
      document.getElementById("modalTitle").textContent = isRealTrip ? "編輯行程" : "新增行程（參考範例）";
      deleteBtn.hidden = !isRealTrip;
      formTripType = trip.type === "roundtrip" ? "roundtrip" : "oneway";
      openLegIdx = 0;
      formLegs = (trip.legs || [emptyLeg()]).map(function(l){ return JSON.parse(JSON.stringify(l)); });
      document.getElementById("f_notes").value = trip.notes || "";
      document.getElementById("f_tripTagLabel").value = trip.tagLabel || "";
    } else {
      state.editingTripId = null;
      document.getElementById("modalTitle").textContent = "新增行程";
      deleteBtn.hidden = true;
      formTripType = "oneway";
      openLegIdx = 0;
      formLegs = [ emptyLeg(prefillDate) ];
      document.getElementById("f_notes").value = "";
      document.getElementById("f_tripTagLabel").value = "";
    }
    renderTagQuick();
    setSegmented("f_tripType", formTripType);
    renderLegForms();
    overlay.hidden = false;
    resetSheetScroll(overlay);
  }
  function closeModal(){ overlay.hidden = true; goToToday(false); }

  /* icon-only sticker picker (no free-text typing; tap to pick, tap again to clear) */
  function renderTagQuick(){
    var current = document.getElementById("f_tripTagLabel").value;
    document.getElementById("tripTagQuick").innerHTML = STICKER_ICONS.map(function(icon){
      return '<button type="button" class="tag-quick-btn'+(icon===current?' active':'')+'" data-icon="'+icon+'">'+icon+'</button>';
    }).join('');
  }
  document.getElementById("tripTagQuick").addEventListener("click", function(ev){
    var btn = ev.target.closest(".tag-quick-btn");
    if(!btn) return;
    var icon = btn.getAttribute("data-icon");
    var current = document.getElementById("f_tripTagLabel").value;
    document.getElementById("f_tripTagLabel").value = (current === icon) ? "" : icon;
    renderTagQuick();
  });

  /* ---------------- 「新增」FAB: bottom-right circle, fans 3 actions out ---------------- */
  var fabWrap = document.getElementById("fabWrap");
  var fabScrim = document.getElementById("fabScrim");
  function closeFab(){ fabWrap.classList.remove("open"); fabScrim.hidden = true; }
  function toggleFab(){
    var open = fabWrap.classList.toggle("open");
    fabScrim.hidden = !open;
  }
  document.getElementById("fabMainBtn").addEventListener("click", function(ev){
    ev.stopPropagation();
    toggleFab();
  });
  fabScrim.addEventListener("click", closeFab);
  document.getElementById("fabTripBtn").addEventListener("click", function(){
    closeFab();
    openModal(null);
  });
  document.getElementById("fabTagBtn").addEventListener("click", function(){
    closeFab();
    if(state.view !== "calendar"){ document.getElementById("viewCalBtn").click(); }
    var l = labelAdd(state.visibleYm);
    selectedLabelId = l.id;
    resizeModeLabelId = null;
    notifyLabels(); // labelAdd rendered it before it was marked selected — redraw as active
    openLabelEdit(l.id);
  });
  document.getElementById("fabArchiveBtn").addEventListener("click", function(){
    closeFab();
    openArchive();
  });

  /* ---------------- label (calendar sticker) edit modal ---------------- */
  var labelEditOverlay = document.getElementById("labelEditOverlay");
  var editingLabelId = null;
  function openLabelEdit(id){
    var l = labels.find(function(x){ return x.id === id; });
    if(!l) return;
    editingLabelId = id;
    document.getElementById("lbl_text").value = l.text || "";
    document.querySelectorAll("#lblShapeRow .shape-pick-btn").forEach(function(btn){
      btn.classList.toggle("active", btn.getAttribute("data-shape") === (l.shape||"highlight"));
    });
    document.getElementById("lbl_color").value = l.color || THEME_PRESETS[0].c1;
    syncAlphaControl(l.alpha);
    document.getElementById("lbl_textcolor").value = l.textColor || "#272727";
    syncTextAlphaControl(l.textAlpha);
    labelEditOverlay.hidden = false;
    resetSheetScroll(labelEditOverlay);
  }
  function syncAlphaControl(a){
    var has = !(a === null || a === undefined || isNaN(Number(a)));
    var pct = has ? Math.round(Math.max(0.1, Math.min(1, Number(a))) * 100) : 100;
    document.getElementById("lbl_alpha").value = pct;
    document.getElementById("lbl_alpha_val").textContent = has ? pct + "%" : "預設";
  }
  function syncTextAlphaControl(a){
    var has = !(a === null || a === undefined || isNaN(Number(a)));
    var pct = has ? Math.round(Math.max(0.1, Math.min(1, Number(a))) * 100) : 100;
    document.getElementById("lbl_textalpha").value = pct;
    document.getElementById("lbl_textalpha_val").textContent = has ? pct + "%" : "預設";
  }
  function commitLabelText(){
    if(editingLabelId) labelPatch(editingLabelId, { text: document.getElementById("lbl_text").value });
  }
  function closeLabelEdit(){
    commitLabelText();
    labelEditOverlay.hidden = true;
    editingLabelId = null;
  }
  document.getElementById("closeLabelEditBtn").addEventListener("click", closeLabelEdit);
  document.getElementById("doneLabelBtn").addEventListener("click", closeLabelEdit);
  labelEditOverlay.addEventListener("click", function(ev){ if(ev.target === labelEditOverlay) closeLabelEdit(); });
  document.getElementById("lblShapeRow").addEventListener("click", function(ev){
    var btn = ev.target.closest(".shape-pick-btn");
    if(!btn || !editingLabelId) return;
    document.querySelectorAll("#lblShapeRow .shape-pick-btn").forEach(function(b){ b.classList.remove("active"); });
    btn.classList.add("active");
    labelPatch(editingLabelId, { shape: btn.getAttribute("data-shape") });
  });
  document.getElementById("deleteLabelBtn").addEventListener("click", function(){
    if(editingLabelId) labelDelete(editingLabelId);
    closeLabelEdit();
  });
  document.getElementById("lbl_color").addEventListener("input", function(){
    if(editingLabelId) labelPatch(editingLabelId, { color: this.value });
  });
  document.getElementById("lbl_alpha").addEventListener("input", function(){
    var pct = Number(this.value);
    document.getElementById("lbl_alpha_val").textContent = pct + "%";
    if(editingLabelId) labelPatch(editingLabelId, { alpha: pct / 100 });
  });
  document.getElementById("lbl_textcolor").addEventListener("input", function(){
    if(editingLabelId) labelPatch(editingLabelId, { textColor: this.value });
  });
  document.getElementById("lbl_textalpha").addEventListener("input", function(){
    var pct = Number(this.value);
    document.getElementById("lbl_textalpha_val").textContent = pct + "%";
    if(editingLabelId) labelPatch(editingLabelId, { textAlpha: pct / 100 });
  });

  /* ---------------- 行程記錄 (archive: browse any past year/month) ---------------- */
  var archiveOverlay = document.getElementById("archiveOverlay");
  function renderArchive(){
    var ym = document.getElementById("archiveYm").value || state.visibleYm;
    var legs = flatLegs(trips); // always real saved trips, never the demo examples
    var monthLegs = legs.filter(function(l){ return (l.date||"").slice(0,7) === ym; });
    document.getElementById("archiveLedgerCaption").textContent = labelForYm(ym) + " · 記帳";
    var archCount = tileCount();
    var layout = effectiveTileLayout().slice(0, archCount);
    var ledgerHtml = "";
    document.getElementById("archiveLedger").classList.toggle("ledger-2", archCount === 2);
    layout.forEach(function(id){
      var meta = METRIC_META[id] || METRIC_META.trip_count;
      var val = computeMetric(id, monthLegs);
      var display = meta.unit === "money" ? fmtMoney(val) : (val + " 筆");
      ledgerHtml += '<div class="ledger-tile"><div class="k">'+meta.label+'</div><div class="v '+meta.unit+'">'+display+'</div></div>';
    });
    document.getElementById("archiveLedger").innerHTML = ledgerHtml;

    var listEl = document.getElementById("archiveListContainer");
    if(monthLegs.length === 0){
      listEl.innerHTML = '<div class="empty-list">這個月沒有行程紀錄。</div>';
      return;
    }
    monthLegs.sort(function(a,b){ return a.date < b.date ? -1 : 1; });
    listEl.innerHTML = monthLegs.map(function(l){
      var dstatus = l.status || "unpaid";
      var dt = new Date(l.date+"T00:00:00");
      var sLabel = settings.showReimbursement ? settleLabel(l) : null;
      return '<div class="trip-card" data-trip-id="'+l.tripId+'">'+
        '<div class="trip-date">'+
          '<div class="d mono">'+dt.getDate()+'</div>'+
          '<div class="w">週'+WEEKDAY_NAMES[dt.getDay()]+'</div>'+
        '</div>'+
        '<div class="trip-main">'+
          '<div class="trip-top">'+
            '<span class="route-text">'+escapeHtml(l.from)+' → '+escapeHtml(l.to)+'</span>'+
            '<span class="status-pill '+dstatus+'">'+STATUS_META[dstatus].label+'</span>'+
          '</div>'+
        '</div>'+
        '<div class="trip-price">'+
          '<div class="total mono">'+fmtMoney(legTotal(l))+'</div>'+
          (sLabel ? '<span class="settle-chip '+settleClass(l)+'">'+sLabel+'</span>' : '')+
        '</div>'+
      '</div>';
    }).join('');
    listEl.querySelectorAll(".trip-card").forEach(function(card){
      card.addEventListener("click", function(){
        var tripId = this.getAttribute("data-trip-id");
        archiveOverlay.hidden = true; // the trip modal covers it instantly, so skip the slide-out here
        openModal(tripId);
      });
    });
  }
  function openArchive(){
    document.getElementById("archiveYm").value = state.visibleYm;
    renderArchive();
    archiveModalEl.style.transition = ""; archiveModalEl.style.transform = "";
    archiveClosing = false;
    archiveOverlay.hidden = false;
    resetSheetScroll(archiveOverlay);
  }
  var archiveModalEl = archiveOverlay.querySelector(".modal");
  var archiveClosing = false;
  /* Every way of closing this sheet (✕ button, tapping the backdrop, or
     dragging it down) plays the same pure slide-down-and-off animation —
     no fade, it just visibly travels off the bottom of the screen before
     the overlay is actually hidden. This needs `transform` (not margin-top):
     the sheet is a flex child bottom-anchored via the overlay's
     align-items:flex-end, and margin-top on a flex-end-aligned item doesn't
     actually move it — that's why nothing appeared to happen at first.
     transform bypasses flex alignment entirely and just visually offsets
     the box. (We avoided transform for the *entrance* animation because it
     upsets the sticky footer button's position while the sheet stays open
     and interactive afterward — that risk doesn't apply here since the
     sheet is hidden the moment this transform finishes.) */
  function closeArchive(){
    if(archiveOverlay.hidden || archiveClosing) return;
    archiveClosing = true;
    var dist = archiveModalEl.getBoundingClientRect().height + 60;
    archiveModalEl.style.transition = "transform .32s cubic-bezier(.3,.3,.3,1)";
    archiveModalEl.style.transform = "translateY(" + dist + "px)";
    setTimeout(function(){
      archiveOverlay.hidden = true;
      archiveModalEl.style.transition = ""; archiveModalEl.style.transform = "";
      archiveClosing = false;
    }, 320);
  }
  document.getElementById("archiveYm").addEventListener("change", renderArchive);
  document.getElementById("closeArchiveBtn").addEventListener("click", closeArchive);
  document.getElementById("closeArchiveBtn2").addEventListener("click", closeArchive);
  archiveOverlay.addEventListener("click", function(ev){ if(ev.target === archiveOverlay) closeArchive(); });

  /* Swipe the whole sheet down to dismiss it — no visible handle, the sheet
     itself just follows your finger (like a big invisible drag button).
     Past the threshold it hands off to closeArchive() (continuing the slide
     from wherever the finger let go, straight off the bottom of the
     screen); short of it, it springs back to resting position. Only starts
     when the sheet is already scrolled to its very top, so it never fights
     with scrolling the trip list inside. */
  (function enableSwipeDownToDismiss(modalEl, closeFn){
    var startY = 0, startX = 0, dragging = false, tracking = false, dy = 0;
    modalEl.addEventListener("touchstart", function(ev){
      if(ev.touches.length !== 1 || modalEl.scrollTop > 0) return;
      startY = ev.touches[0].clientY; startX = ev.touches[0].clientX;
      tracking = true; dragging = false; dy = 0;
    }, { passive:true });
    modalEl.addEventListener("touchmove", function(ev){
      if(!tracking) return;
      var t = ev.touches[0];
      var ndy = t.clientY - startY, ndx = t.clientX - startX;
      if(!dragging){
        if(ndy > 8 && Math.abs(ndy) > Math.abs(ndx)){ dragging = true; }
        else if(Math.abs(ndx) > 8){ tracking = false; return; }
        else { return; }
      }
      dy = Math.max(0, ndy);
      modalEl.style.transition = "none";
      modalEl.style.transform = "translateY(" + dy + "px)";
      if(ev.cancelable) ev.preventDefault();
    }, { passive:false });
    function settle(){
      tracking = false;
      if(!dragging){ return; }
      dragging = false;
      if(dy > 100){
        closeFn();
      } else {
        modalEl.style.transition = "transform .22s cubic-bezier(.2,.8,.2,1)";
        modalEl.style.transform = "translateY(0)";
        setTimeout(function(){ modalEl.style.transition = ""; modalEl.style.transform = ""; }, 220);
      }
    }
    modalEl.addEventListener("touchend", settle);
    modalEl.addEventListener("touchcancel", settle);
  })(archiveModalEl, closeArchive);

  document.getElementById("closeModalBtn").addEventListener("click", closeModal);
  overlay.addEventListener("click", function(ev){ if(ev.target === overlay) closeModal(); });

  document.getElementById("saveBtn").addEventListener("click", function(){
    var blocks = document.querySelectorAll(".leg-block");
    var legs = [];
    for(var i=0;i<blocks.length;i++){
      var leg = readLegFromBlock(blocks[i]);
      var who = formTripType === "roundtrip" ? (i === 0 ? "去程" : "回程") : "";
      if(!leg.date || !leg.from || !leg.to){ openLeg(i); }
      if(!leg.date){ formFieldError(blocks[i].querySelector(".f-date"), "請選擇"+who+"日期"); return; }
      if(!leg.from){ formFieldError(blocks[i].querySelector(".f-from"), "請填寫"+who+"出發地"); return; }
      if(!leg.to){ formFieldError(blocks[i].querySelector(".f-to"), "請填寫"+who+"目的地"); return; }
      var old = formLegs[i] || {};
      if(typeof old.stickerX === "number") leg.stickerX = old.stickerX;
      if(typeof old.stickerY === "number") leg.stickerY = old.stickerY;
      legs.push(leg);
    }
    var data = {
      type: formTripType, legs: legs,
      notes: document.getElementById("f_notes").value.trim(),
      tagLabel: document.getElementById("f_tripTagLabel").value.trim().slice(0,4)
    };
    var p = state.editingTripId ? dataUpdate(state.editingTripId, data) : dataAdd(data);
    // the trip already shows up locally the instant it is saved (see
    // dataAdd), so there is nothing to wait for: close right away, and only
    // speak up if the database later refuses it
    closeModal();
    p.then(function(ok){
      if(ok === false) showToast("儲存失敗，請再試一次");
    });
  });

  document.getElementById("deleteBtn").addEventListener("click", function(){
    if(!state.editingTripId) return;
    dataDelete(state.editingTripId).then(function(){ closeModal(); });
  });

  /* ---------------- boot ---------------- */
  initData();

  /* Safety net, stage 1 (after 4s): the cloud has not answered. Rather than a blank screen, show the logo
     and say what we are waiting for (tap to retry). Stage 2 (after 20s): give up waiting and show the app
     from this device's saved copy, with a small "connecting" pill; it fills in by itself once the cloud answers. */
  setTimeout(function(){
    if(bootVeilLifted) return;
    try{ var raw = localStorage.getItem(SETTINGS_LOCAL_KEY); if(raw) Object.assign(settings, JSON.parse(raw)); }catch(e){}
    applyThemeMode();
    revealBootContent();
    var bc = document.querySelector("#bootVeil .boot-content");
    if(bc && !document.querySelector("#bootVeil .boot-status")){
      var st = document.createElement("div"); st.className = "boot-status";
      st.innerHTML = '正在連線雲端…<small>' + syncReason() + '・點一下重新連線</small>';
      st.addEventListener("click", function(){ location.reload(); });
      bc.appendChild(st);
    }
  }, 4000);
  setTimeout(function(){
    if(bootVeilLifted) return;
    showSyncHint(true);
    loadLocalSettings();
  }, 20000);

  /* Opening the app again from the home screen resumes the old page, so the splash and greeting would
     never play again. After the app has been away a little while, restart it so they play like a fresh open
     (data comes straight back from the cache). A form that is open is never thrown away. */
  var REPLAY_AFTER_MS = 10000;
  var hiddenAt = 0;
  var loginBusy = false; // true while the Google sign-in window is open — never restart the page under it
  function maybeReplay(){
    if(!hiddenAt) return;
    var away = Date.now() - hiddenAt; hiddenAt = 0;
    if(away < REPLAY_AFTER_MS) return;
    if(loginBusy || document.querySelector(".overlay:not([hidden])")) return;
    location.reload();
  }
  document.addEventListener("visibilitychange", function(){
    if(document.hidden){ hiddenAt = Date.now(); } else { maybeReplay(); }
  });

  /* ---------------- yearly clean-up: only the last three calendar years are kept ---------------- */
  var purgeState = null;
  function purgeScan(){
    var cut = new Date().getFullYear() - 3;
    var byTrip = {};
    flatLegs(trips).forEach(function(l){
      var o = byTrip[l.tripId] || (byTrip[l.tripId] = { id: l.tripId, date: l.date, legs: [], total: 0 });
      if(l.date && l.date < o.date) o.date = l.date;
      o.legs.push(l); o.total += legTotal(l);
    });
    var tl = Object.keys(byTrip).map(function(k){ return byTrip[k]; })
      .filter(function(o){ return o.date && Number(o.date.slice(0,4)) <= cut; })
      .sort(function(a,b){ return a.date < b.date ? -1 : 1; });
    var ll = labels.filter(function(l){ return l.ym && Number(String(l.ym).slice(0,4)) <= cut; });
    return { trips: tl, labels: ll };
  }
  function checkPurge(tries){
    if(!settings.onboarded){ if((tries||0) < 3) setTimeout(function(){ checkPurge((tries||0)+1); }, 3000); return; }
    var sc = purgeScan();
    if(!sc.trips.length && !sc.labels.length) return;
    purgeState = sc;
    var years = {};
    sc.trips.forEach(function(o){ years[o.date.slice(0,4)] = 1; });
    sc.labels.forEach(function(l){ years[String(l.ym).slice(0,4)] = 1; });
    var ys = Object.keys(years).sort();
    var total = sc.trips.reduce(function(a,o){ return a + o.total; }, 0);
    document.getElementById("purgeTitle").textContent = ys.join("、") + " 年的資料即將刪除";
    document.getElementById("purgeSum").innerHTML =
      '<div class="purge-chip"><span class="k">行程</span><span class="n">'+sc.trips.length+' 筆</span></div>'+
      '<div class="purge-chip"><span class="k">標籤貼紙</span><span class="n">'+sc.labels.length+' 個</span></div>'+
      '<div class="purge-chip"><span class="k">合計金額</span><span class="n">'+fmtMoney(total)+'</span></div>';
    var html = "", lastY = "", i = 0, yi = 0;
    sc.trips.forEach(function(o){
      var y = o.date.slice(0,4);
      if(y !== lastY){ html += '<div class="purge-yr y'+(yi++ % 3)+'">'+y+' 年</div>'; lastY = y; }
      var first = o.legs.slice().sort(function(a,b){ return a.date < b.date ? -1 : 1; })[0];
      var route = o.legs.length > 1 ? escapeHtml(first.from)+" ⇄ "+escapeHtml(first.to) : escapeHtml(first.from)+" → "+escapeHtml(first.to);
      html += '<div class="purge-row" style="--i:'+(i++)+';animation-delay:'+Math.min(i*30,600)+'ms"><span class="d">'+o.date.slice(5).replace("-","/")+'</span><span class="r">'+route+'</span><span class="m">'+fmtMoney(o.total)+'</span></div>';
    });
    if(!sc.trips.length) html = '<div class="purge-row"><span class="r">只有貼紙</span></div>';
    var listEl = document.getElementById("purgeList");
    listEl.className = "purge-list"; listEl.innerHTML = html; listEl.scrollTop = 0;
    document.getElementById("purgeOverlay").hidden = false;
  }
  document.getElementById("purgeLaterBtn").addEventListener("click", function(){
    document.getElementById("purgeOverlay").hidden = true;
  });
  document.getElementById("purgeOkBtn").addEventListener("click", function(){
    if(!purgeState) return;
    var sc = purgeState; purgeState = null;
    var btn = this; btn.disabled = true;
    var listEl = document.getElementById("purgeList");
    listEl.classList.add("going");
    setTimeout(function(){
      if(!sc.demo){
        sc.trips.forEach(function(o){ dataDelete(o.id); });
        sc.labels.forEach(function(l){ labelDelete(l.id); });
      }
      document.getElementById("purgeOverlay").hidden = true;
      btn.disabled = false;
      showToast("舊資料已刪除");
    }, 520 + Math.min(sc.trips.length, 12) * 40);
  });
  setTimeout(function(){ checkPurge(0); }, 4500);
})();
